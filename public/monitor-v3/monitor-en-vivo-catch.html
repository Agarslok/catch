<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor en vivo · Catch Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Paleta y tipografía del demo "Capital Humano Live" de Catch */
:root{
  --navy:#5B9BD5; --azul:#2778B1; --cyan:#38AECB; --cielo:#EEF5FA; --ambar:#F2C879; --vivo:#E0453A; --profundo:#1B4F7A; --gris-azul:#C9D6E2;
  --fondo:#FFFFFF; --superficie:#FFFFFF; --pista:#F7F9FB; --borde:#E6E7E8; --tinta:#232222; --suave:#5B6168; --rail1:#0B5FB4; --rail2:#1B86DA;
  --display:'Comfortaa','Nunito Sans',system-ui,sans-serif; --texto:'Nunito Sans','Helvetica Neue',system-ui,sans-serif;
  color-scheme: light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#A9CBEA; --azul:#6FB0E3; --cyan:#5CC6DE; --cielo:#132233; --ambar:#F0B657; --fondo:#0E1823; --superficie:#121F2D; --pista:#16263A; --borde:#24364A; --tinta:#EEF2F6; --suave:#A5B1BE; --rail1:#0A3D78; --rail2:#0F5AA6; color-scheme:dark; } }
:root[data-theme="dark"]{ --navy:#A9CBEA; --azul:#6FB0E3; --cyan:#5CC6DE; --cielo:#132233; --ambar:#F0B657; --fondo:#0E1823; --superficie:#121F2D; --pista:#16263A; --borde:#24364A; --tinta:#EEF2F6; --suave:#A5B1BE; --rail1:#0A3D78; --rail2:#0F5AA6; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--fondo); color:var(--tinta); font:16px/1.5 var(--texto); font-variant-numeric:tabular-nums}
button,select,textarea,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
.oculto{display:none!important}
h1,h2,h3{font-family:var(--display); letter-spacing:-.01em}

/* barra de demo para elegir la vista */
.demo{position:relative; z-index:60; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 18px; background:var(--superficie); border-bottom:1px solid var(--borde); font-size:13px; color:var(--suave)}
.demo strong{color:var(--tinta); font-family:var(--display)}
.seg{display:inline-flex; background:var(--pista); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; padding:5px 14px; border-radius:999px; color:var(--suave)}
.seg button[aria-pressed="true"]{background:var(--superficie); color:var(--azul); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08)}
.estado-sync{margin-left:auto}
.punto{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--borde); margin-right:6px; vertical-align:middle}
.punto.vivo{background:var(--vivo); animation:parpadeo 1.6s infinite}
@keyframes parpadeo{50%{opacity:.35}}

/* ===== pantalla del cliente ===== */
.cliente{display:grid; grid-template-columns:232px 1fr; min-height:calc(100vh - 46px)}
.rail{background:#FFFFFF; color:var(--tinta); border-right:1px solid var(--borde); padding:24px 14px; display:flex; flex-direction:column; gap:4px}
.rail .marca{font-family:var(--display); font-size:30px; font-weight:700; margin:2px 10px 22px; color:var(--azul)}
.rail .marca small{display:block; font-family:var(--texto); font-size:11px; font-weight:600; letter-spacing:4px; color:var(--cyan)}
.rail button{display:flex; align-items:center; gap:12px; border:0; background:transparent; color:var(--suave); padding:11px 12px; border-radius:12px; text-align:left; font-weight:600; transition:background .2s, color .2s}
.rail button:hover{background:var(--pista); color:var(--azul)}
.rail button svg{flex:none; width:22px; height:22px; color:var(--cyan)}
.rail button[aria-current="true"]{background:var(--cielo); color:var(--azul)}
.rail button[aria-current="true"] svg{color:var(--azul)}
.rail button .avance{margin-left:auto; font-size:12px; opacity:.9}
.rail .pie{margin-top:auto; font-size:12px; color:var(--suave); padding:0 10px}
.escena{display:flex; flex-direction:column; min-width:0; background:var(--fondo)}
.cabeza{display:flex; align-items:center; gap:16px; padding:22px 40px 10px}
.cabeza h1{margin:2px 0 0; font-size:30px; color:var(--tinta); font-weight:700}
.cabeza .ruta{color:var(--azul); font-size:14px; font-weight:700}
.cabeza .derecha{margin-left:auto; display:flex; gap:6px; align-items:center}
.btn{border:1px solid var(--borde); background:var(--superficie); padding:8px 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--tinta); transition:border-color .2s, transform .2s}
.btn:hover{border-color:var(--azul)}
.btn.prim{background:var(--azul); color:#fff; border-color:var(--azul)}
.btn.suave{background:var(--cielo); border-color:transparent; color:var(--azul)}
.btn.texto{border-color:transparent; background:transparent; color:var(--suave); padding:8px 10px}
.btn.texto:hover{color:var(--azul)}
.btn.flecha{width:40px; height:40px; padding:0; font-size:20px; line-height:1; display:inline-grid; place-items:center}
.cuerpo{padding:12px 40px 40px; flex:1; min-width:0}

/* avance de la sección */
.recorrido{display:flex; gap:6px; align-items:center; margin-bottom:22px}
.recorrido span{height:4px; border-radius:4px; background:var(--borde); width:38px; transition:all .3s}
.recorrido span.hecho{background:var(--cyan)}
.recorrido span.actual{background:var(--azul); width:64px}
.recorrido em{font-style:normal; color:var(--suave); font-size:13px; margin-left:10px}

/* escena de explicación: cifra a la izquierda, gráfico interactivo a la derecha */
.explica{display:grid; grid-template-columns:minmax(300px,.9fr) minmax(0,1.3fr); gap:56px; align-items:center; min-height:58vh}
.copia .kicker{color:var(--suave); font-size:14px; font-weight:700; margin:0 0 10px}
.grande{font-family:var(--display); font-weight:700; font-size:clamp(64px,7.5vw,116px); line-height:1; letter-spacing:-.04em; color:var(--azul); margin:0}
.grande-lab{font-size:18px; color:var(--suave); margin:8px 0 22px}
.copia .lede{font-size:21px; line-height:1.5; margin:0 0 26px; max-width:34ch}
.stats{display:flex; flex-wrap:wrap; gap:36px; border-top:1px solid var(--borde)}
.stats div{display:flex; flex-direction:column; gap:2px; padding-top:14px}
.stats strong{font-family:var(--display); font-size:26px; color:var(--tinta)}
.stats div.tuya strong{color:var(--azul)}
.stats div.tuya strong::before,.kpi.tuya b::before{content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ambar); margin-right:8px; vertical-align:middle}
.stats span{font-size:13px; color:var(--suave)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:22px}
.chip{border:1px solid var(--borde); color:var(--suave); background:transparent; border-radius:999px; padding:4px 12px; font-size:13px}
.chip:hover{border-color:var(--azul); color:var(--azul)}
.grafico .tit{font-size:14px; color:var(--suave); margin:0 0 10px; display:flex; justify-content:space-between; gap:10px}
.grafico .tit b{color:var(--tinta); font-weight:700}
.lienzo{position:relative; height:400px}
.toca{font-size:12.5px; color:var(--suave)}

/* hoja completa */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; margin-bottom:28px; border-top:1px solid var(--borde)}
.kpi{padding:16px 18px 4px 0}
.kpi b{display:block; font-family:var(--display); font-size:34px; color:var(--azul); font-weight:700; letter-spacing:-.02em}
.kpi span{font-size:13px; color:var(--suave)}
.kpi.tuya b{color:var(--azul)}
.hoja{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px 48px}
.hoja .celda{animation:aparece .55s both}
.hoja .celda:nth-child(2){animation-delay:.07s}.hoja .celda:nth-child(3){animation-delay:.14s}.hoja .celda:nth-child(4){animation-delay:.21s}
@keyframes aparece{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.celda h2{margin:0; font-size:17px; color:var(--tinta)}
.celda .sub{margin:2px 0 10px; color:var(--suave); font-size:13px}
.hoja .lienzo--hoja{height:clamp(150px,20vh,210px); min-height:140px}
.hoja--preview{gap:18px 22px; grid-template-columns:repeat(2,minmax(0,1fr))}
.hoja--preview .lienzo--hoja{height:118px; min-height:100px}
.hoja--preview .celda--hoja h2{font-size:14px; line-height:1.25}
.hoja--preview .celda--hoja .sub{font-size:11px; margin-bottom:6px}
.hoja--preview .btn-detalle{font-size:11px; padding:4px 10px; min-height:28px}
.celda--hoja{border:1px solid var(--borde); border-radius:14px; padding:14px 16px 12px; background:var(--superficie); display:flex; flex-direction:column}
.celda--hoja .lienzo{flex:1}
.hoja-detalle-nav{margin-bottom:16px}
.hoja .celda .btn-detalle{margin-top:auto; align-self:flex-start}
.filtros{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:22px; font-size:14px}
.filtros label{color:var(--suave); display:flex; gap:6px; align-items:center}
.filtros select{border:1px solid var(--borde); background:var(--superficie); border-radius:999px; padding:5px 12px}
.aviso{font-size:13px; color:var(--vivo)}
.leyenda-tuya{font-size:13px; color:var(--suave)}
.leyenda-tuya i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ambar); margin-right:5px}
.portada{max-width:900px; padding-top:4vh}
.portada .grande{font-size:clamp(44px,5vw,72px); color:var(--tinta); letter-spacing:-.03em}
.portada p.lede{font-size:21px; color:var(--suave); max-width:46ch; margin:18px 0 36px}
.agenda{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border-top:1px solid var(--borde)}
.agenda div{padding:16px 18px 0 0}
.agenda b{display:block; font-family:var(--display); color:var(--azul); font-size:17px; margin-bottom:4px}
.agenda span{font-size:13px; color:var(--suave)}
.nota-anon{font-size:13px; color:var(--suave)}

/* justificación del dato (panel inferior) */
.fuente{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px); width:min(760px,calc(100vw - 32px)); background:var(--superficie); border:1px solid var(--borde); border-radius:18px; padding:18px 22px; box-shadow:0 18px 50px rgba(27,79,122,.18); z-index:40; opacity:0; visibility:hidden; transition:all .25s}
.fuente.abierta{opacity:1; visibility:visible; transform:translate(-50%,0)}
.fuente .cab{display:flex; align-items:baseline; gap:12px}
.fuente .cab h3{margin:0; font-size:15px; color:var(--suave); font-family:var(--texto); font-weight:700}
.fuente .cab button{margin-left:auto}
.fuente .valor{font-family:var(--display); font-size:30px; color:var(--azul); margin:4px 0 10px}
.fuente dl{display:grid; grid-template-columns:150px 1fr; gap:6px 16px; margin:0; font-size:14px}
.fuente dt{color:var(--suave)}
.fuente dd{margin:0}

/* avatar desplegable */
.avatar-w{position:fixed; right:24px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:45; display:flex; flex-direction:column; align-items:flex-end; gap:12px}
.fab{min-height:56px; padding:0 22px 0 16px; border-radius:999px; border:0; color:#fff; font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,var(--azul),var(--cyan)); box-shadow:0 8px 24px rgba(39,120,177,.3); transition:transform .2s, box-shadow .2s}
.fab:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(39,120,177,.4)}
.fab .pulso{position:relative; width:12px; height:12px; border-radius:50%; background:#fff}
.fab .pulso::after{content:""; position:absolute; inset:0; border-radius:50%; background:#fff; animation:aiPulse 1.6s infinite}
@keyframes aiPulse{0%{transform:scale(1); opacity:.7}100%{transform:scale(2.2); opacity:0}}
.panel-av{width:min(380px,calc(100vw - 32px)); background:#FFFFFF; color:var(--tinta); border:1px solid var(--borde); border-radius:20px; overflow:hidden; box-shadow:0 16px 40px rgba(39,120,177,.16); transform-origin:bottom right; animation:abre .22s both}
@keyframes abre{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1; transform:none}}
.panel-av .video{aspect-ratio:16/9; background:linear-gradient(135deg,#2778B1,#38AECB); display:grid; place-items:center; text-align:center; font-size:13px; color:rgba(255,255,255,.9); padding:12px}
.panel-av .video .cara{width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#E3F5FA,#9FDCEB 55%,#5CC6DE); margin:0 auto 8px; position:relative}
.panel-av .video .cara.habla::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid #7FD3E6; animation:aiPulse 1.2s infinite}
.panel-av .dentro{padding:14px 16px 16px}
.panel-av .dentro p{margin:0 0 12px; font-size:15px; line-height:1.5}
.panel-av .acc{display:flex; gap:8px; flex-wrap:wrap}
.panel-av .acc button{border:1px solid var(--borde); background:#FFFFFF; color:var(--azul); border-radius:999px; padding:6px 12px; font-weight:700; font-size:13px}
.panel-av .acc button.lleno{background:var(--azul); color:#fff; border-color:var(--azul)}

/* ventanas */
.velo{position:fixed; inset:0; background:rgba(35,34,34,.28); display:grid; place-items:center; z-index:50; padding:20px}
.modal{background:var(--superficie); border-radius:20px; padding:26px; width:min(520px,100%); border:1px solid var(--borde); box-shadow:0 24px 60px rgba(27,79,122,.18); animation:abre .2s both}
.modal h3{margin:0 0 6px; color:var(--tinta); font-size:22px}
.modal p{margin:0 0 16px; color:var(--suave)}
.opciones{display:grid; gap:8px}
.opciones button{text-align:left; border:1px solid var(--borde); background:var(--superficie); border-radius:14px; padding:13px 16px; font-weight:700}
.opciones button:hover{border-color:var(--azul)}
.opciones button small{display:block; font-weight:400; color:var(--suave)}
textarea{width:100%; min-height:90px; border:1px solid var(--borde); background:var(--pista); border-radius:12px; padding:10px 12px; resize:vertical}
.fila{display:flex; gap:8px; justify-content:flex-end; margin-top:12px}
.glosario dt{font-weight:800; color:var(--azul); margin-top:12px}
.glosario dd{margin:2px 0 0}
.chat{display:flex; flex-direction:column; gap:8px; max-height:300px; overflow:auto; margin-bottom:10px}
.msg{padding:9px 13px; border-radius:14px; max-width:90%}
.msg.yo{background:var(--cielo); align-self:flex-end}
.msg.ia{background:var(--pista)}

/* ===== moderador ===== */
.moderador{display:grid; grid-template-columns:270px minmax(0,1fr) 350px; min-height:calc(100vh - 46px)}
.mod-col{background:var(--superficie); overflow:auto; max-height:calc(100vh - 46px); border-right:1px solid var(--borde)}
.mod-col:last-child{border-right:0; border-left:1px solid var(--borde)}
.mod-col h3{margin:0; padding:18px 18px 8px; font-size:14px; color:var(--suave); font-family:var(--texto)}
.pasos{list-style:none; margin:0; padding:0 10px 18px}
.pasos .grupo{padding:12px 8px 4px; font-weight:800; color:var(--tinta); font-size:14px}
.pasos button{width:100%; text-align:left; border:0; background:transparent; padding:6px 10px; border-radius:10px; font-size:14px; color:var(--suave); display:flex; gap:8px; align-items:center}
.pasos button:hover{color:var(--azul)}
.pasos button[aria-current="true"]{background:var(--cielo); color:var(--azul); font-weight:700}
.pasos button .ok{margin-left:auto; font-size:12px; color:var(--azul)}
.mod-centro{padding:20px 26px; overflow:auto; max-height:calc(100vh - 46px); background:var(--pista)}
.mod-centro .titulo{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.mod-centro .titulo h2{margin:0; font-size:20px}
.pantalla{border:1px solid var(--borde); border-radius:16px; overflow:hidden; background:var(--superficie)}
.pantalla .barra{display:flex; justify-content:space-between; padding:8px 14px; font-size:12px; color:var(--suave); border-bottom:1px solid var(--borde)}
.pantalla .dentro{padding:20px 22px}
.pantalla .explica{min-height:0; gap:28px}
.pantalla .grande{font-size:56px}
.pantalla .copia .lede{font-size:16px}
.pantalla .lienzo{height:270px}
.pantalla .hoja{gap:22px 28px}
.pantalla .hoja .lienzo{height:170px}
.pantalla .kpi b{font-size:24px}
.pantalla .portada .grande{font-size:38px}
.pantalla .agenda{grid-template-columns:repeat(2,1fr)}
.controles{display:flex; gap:8px; align-items:center; margin:16px 0; flex-wrap:wrap}
.controles .siguiente{margin-left:auto; color:var(--suave); font-size:13px}
.notas{background:var(--superficie); border:1px solid var(--borde); border-radius:16px; padding:16px 18px}
.notas h4{margin:0 0 6px; font-family:var(--display)}
.tabs{display:flex; border-bottom:1px solid var(--borde); position:sticky; top:0; background:var(--superficie); z-index:2}
.tabs button{flex:1; border:0; background:transparent; padding:14px 6px; font-weight:700; color:var(--suave); border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--azul); border-bottom-color:var(--azul)}
.badge{display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--vivo); color:#fff; font-size:12px; margin-left:4px}
.lista{padding:14px 16px; display:grid; gap:12px}
.pregunta{border:1px solid var(--borde); border-radius:14px; padding:12px 14px}
.pregunta .meta{font-size:12px; color:var(--suave); margin-bottom:4px}
.pregunta .acc{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.pregunta.respondida,.pregunta.atendida,.pregunta.descartada{opacity:.72}
.pregunta--oral{border-color:var(--vivo); border-width:2px}
.pregunta .cola-tipo{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--azul); margin-bottom:6px}
.pregunta .cola-tipo--oral{color:var(--vivo)}
.pregunta .resp{margin-top:8px; padding:8px 10px; border-left:2px solid var(--cyan); background:var(--pista); font-size:14px}
.ia-cola-acc{margin-top:10px; gap:8px; flex-wrap:wrap}
.ia-escala-oferta{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--cielo); border:1px solid var(--borde)}
.ia-escala-oferta .ia-escala-preg{font-size:13px; color:var(--suave); margin:0 0 10px; font-style:italic}
.ia-escala-ok{margin-top:10px; font-size:14px; color:var(--azul); font-weight:600}
.menu-presentador{display:grid; gap:12px; margin-top:8px}
.menu-presentador .opcion-presentador{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:1px solid var(--borde); border-radius:14px; padding:14px 16px; background:var(--superficie); cursor:pointer; font:inherit; color:inherit}
.menu-presentador .opcion-presentador:hover{border-color:var(--cyan); background:var(--cielo)}
.menu-presentador .opcion-presentador strong{display:block; font-size:15px; margin-bottom:4px}
.menu-presentador .opcion-presentador small{display:block; font-size:12.5px; color:var(--suave); line-height:1.35}
.menu-presentador .opcion-presentador .ico{flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--pista); color:var(--azul)}
.menu-presentador .opcion-presentador--oral .ico{background:#fff0f0; color:var(--vivo)}
.menu-presentador .opcion-presentador .ico svg{width:22px; height:22px}
.confirm-turno{text-align:center; padding:8px 0}
.confirm-turno .ok-mark{font-size:42px; line-height:1; color:var(--cyan); margin-bottom:8px}
.barra-h{display:grid; grid-template-columns:1fr 40px; gap:6px; align-items:center; font-size:13.5px; margin:8px 0}
.barra-h .pista{height:6px; border-radius:6px; background:var(--pista); overflow:hidden; grid-column:1/-1}
.barra-h .pista i{display:block; height:100%; background:var(--cyan)}
.sugerencia{background:var(--cielo); border-radius:14px; padding:12px 14px; font-size:14px}
.vacio{color:var(--suave); font-size:14px; padding:6px 2px}

/* ===== celular ===== */
.movil-marco{display:flex; justify-content:center; padding:22px; background:var(--pista); min-height:calc(100vh - 46px)}
.movil{width:min(400px,100%); background:var(--superficie); border:1px solid var(--borde); border-radius:30px; overflow:hidden; display:flex; flex-direction:column; min-height:760px; box-shadow:0 18px 50px rgba(27,79,122,.12); position:relative}
.movil.real{border-radius:0; border:0; box-shadow:none; width:100%; min-height:100vh}
.movil header{padding:18px 20px 8px; border-bottom:1px solid var(--borde)}
.movil header .linea{display:flex; justify-content:space-between; font-size:12.5px; color:var(--suave)}
.movil header h2{margin:6px 0 0; font-size:20px; color:var(--azul)}
.movil header p{margin:2px 0 0; font-size:13px; color:var(--suave)}
.movil .contenido{padding:18px 20px; flex:1; overflow:auto}
.movil .grande{font-size:64px}
.movil .copia .lede{font-size:17px; margin-bottom:16px}
.movil .lienzo{height:240px}
.movil .stats{gap:22px}
.movil .stats strong{font-size:21px}
.movil .acciones{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px; border-top:1px solid var(--borde); background:var(--superficie); position:sticky; bottom:0}
.movil .acciones button{border:1px solid var(--borde); background:var(--superficie); border-radius:14px; padding:10px 6px; font-size:13px; font-weight:700; color:var(--azul)}
.interruptor{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--suave); margin-bottom:12px}

@media (max-width:1180px){ .moderador{grid-template-columns:230px minmax(0,1fr)} .moderador .mod-col:last-child{grid-column:1/-1; border-left:0; border-top:1px solid var(--borde); max-height:none} .explica{gap:32px} }
@media (max-width:900px){ .cliente{grid-template-columns:1fr} .rail{flex-direction:row; overflow-x:auto; padding:10px} .rail .marca,.rail .pie{display:none} .rail button span.nom{white-space:nowrap}
  .explica,.hoja{grid-template-columns:1fr} .agenda{grid-template-columns:repeat(2,1fr)} .moderador{grid-template-columns:1fr} .mod-col{max-height:none} .cabeza{padding:16px 18px 6px} .cuerpo{padding:10px 18px 90px} }
/* ===== zona central del cliente, estructura del demo "Capital Humano Live" ===== */
.cliente .escena{min-height:calc(100vh - 46px)}
.cliente .cabeza{padding:18px 40px 8px}
.cabeza .contexto{font-size:15px; color:var(--suave)}
.cabeza .paso{font-size:14px; color:var(--suave); margin-right:6px}
.pill-vivo{display:inline-flex; align-items:center; gap:6px; background:var(--cielo); color:var(--azul); border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px; border:0}
.cliente .cuerpo{display:flex; flex-direction:column; gap:18px; padding:8px 40px 28px}
.livebar{border:1px solid var(--borde); border-radius:12px; padding:10px 16px; font-size:15px; color:var(--suave)}
.livebar b{color:var(--tinta)}
.livebar button{border:0; background:none; color:var(--azul); font-weight:700; padding:0 4px}
.central{flex:1; display:flex; flex-direction:column; justify-content:center}
.central .explica{min-height:0}
.copia .kicker{color:var(--azul); font-size:15px; font-weight:700; margin:0 0 8px}
.titular{font-family:var(--display); font-size:clamp(30px,2.8vw,44px); line-height:1.15; color:var(--tinta); margin:0 0 16px; font-weight:700; letter-spacing:-.01em}
.seg-graf{display:grid; grid-template-columns:1fr 1fr; background:var(--cielo); border-radius:12px; padding:4px; margin-bottom:14px}
.seg-graf button{border:0; background:transparent; border-radius:9px; padding:9px; font-weight:700; color:var(--suave)}
.seg-graf button[aria-pressed="true"]{background:var(--azul); color:#fff}
.tabla-graf{max-height:400px; overflow:auto; border-top:1px solid var(--borde)}
.tabla-graf table{width:100%; border-collapse:collapse; font-size:14px}
.tabla-graf th{text-align:left; color:var(--suave); font-weight:700; padding:8px 6px; border-bottom:1px solid var(--borde); position:sticky; top:0; background:var(--superficie)}
.tabla-graf td{padding:7px 6px; border-bottom:1px solid var(--borde)}
.tabla-graf td.num,.tabla-graf th.num{text-align:right}
.tabla-graf tr.tuya td{font-weight:800; color:var(--azul)}
.tabla-graf .ref{font-size:13px; color:var(--suave); padding:8px 6px}
.narracion-bar{display:flex; align-items:center; gap:16px; background:var(--profundo); color:#fff; border-radius:16px; padding:14px 18px}
.narracion-bar small{display:block; font-size:12.5px; font-weight:700; opacity:.85}
.narracion-bar p{margin:2px 0 0; font-size:18px; line-height:1.4}
.narracion-bar .ctrl{margin-left:auto; display:flex; gap:10px; align-items:center; flex:none}
.narracion-bar .redondo{width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.45); background:transparent; color:#fff; font-size:18px}
.narracion-bar .estado{background:var(--gris-azul); color:var(--profundo); border-radius:999px; padding:11px 18px; font-weight:700; border:0}
.pregunta-ia label{display:block; font-size:14px; color:var(--suave); margin-bottom:8px}
.fila-ia{display:flex; gap:8px}
.fila-ia input{flex:1; border:1px solid var(--borde); border-radius:12px; padding:12px 14px; background:var(--superficie)}
.fila-ia .btn{border-radius:12px; padding:0 22px}
.resp-ia{margin-top:10px; background:var(--cielo); border-radius:12px; padding:10px 14px; font-size:15px}
.resp-ia:empty{display:none}
.avatar-rail{margin-top:18px; border-radius:16px; overflow:hidden; border:1px solid var(--borde)}
.avatar-rail .cab-av{width:100%; display:flex; justify-content:space-between; align-items:center; border:0; border-radius:0; padding:11px 14px; color:#fff; font-weight:700; background:linear-gradient(135deg,var(--azul),var(--cyan))}
.avatar-rail .cab-av .pulso{position:relative; width:9px; height:9px; border-radius:50%; background:#fff}
.avatar-rail .cab-av .pulso::after{content:""; position:absolute; inset:0; border-radius:50%; background:#fff; animation:aiPulse 1.6s infinite}
.avatar-rail .video{aspect-ratio:4/3; background:linear-gradient(160deg,#E9F3F9,#CFE4F1); display:grid; place-items:center; text-align:center; font-size:12.5px; color:var(--suave); padding:10px}
.avatar-rail .video .cara{width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#7FD3E6,#38AECB 55%,#2778B1); margin:0 auto 6px; position:relative}
.avatar-rail .video .cara.habla::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid #7FD3E6; animation:aiPulse 1.2s infinite}
.avatar-rail .escuchar{width:100%; border:0; border-top:1px solid var(--borde); background:var(--superficie); padding:9px; font-weight:700; color:var(--azul); border-radius:0}
@media (max-width:900px){ .narracion-bar{flex-direction:column; align-items:flex-start} .narracion-bar .ctrl{margin-left:0} .cliente .cuerpo{padding:8px 18px 24px} .avatar-rail{display:none} }
</style>

const vals = a => a.filter(v => v != null && !Number.isNaN(v));
const prom = a => { a = vals(a); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const cuantil = (a, q) => { a = vals(a).sort((x, y) => x - y); if (!a.length) return null; const p = (a.length - 1) * q, i = Math.floor(p); return a[i] + (a[Math.min(i + 1, a.length - 1)] - a[i]) * (p - i); };

function baseOpc(compacto, extra = {}) {   // estilo minimalista: sin bordes de ejes, rejilla tenue
  const f = {family: 'Nunito Sans', size: compacto ? 10 : 12};
  return Object.assign({responsive: true, maintainAspectRatio: false, animation: modoPDF ? false : {duration: 650, easing: 'easeOutCubic'},
    plugins: {legend: {display: false, labels: {color: col('--suave'), usePointStyle: true, pointStyle: 'circle', boxWidth: 8, font: f}},
      tooltip: {backgroundColor: '#FFFFFF', titleColor: '#232222', bodyColor: '#5B6168', borderColor: '#E6E7E8', borderWidth: 1, padding: 10, cornerRadius: 10, titleFont: {family: 'Nunito Sans', weight: '700'}, bodyFont: {family: 'Nunito Sans'}, displayColors: false}},
    scales: {x: {border: {display: false}, ticks: {color: col('--suave'), font: f}, grid: {display: false}},
             y: {border: {display: false}, ticks: {color: col('--suave'), font: f, maxTicksLimit: 5}, grid: {color: col('--borde'), drawTicks: false}}}}, extra);
}

const pctEje = {callback: v => (v * 100).toFixed(0) + '%'};
function barrasH(labels, data, marcar, compacto, fmt = fmtP) {
  const o = baseOpc(compacto, {indexAxis: 'y'});
  o.scales.x.ticks = Object.assign({}, o.scales.x.ticks, pctEje); o.scales.x.grid = {color: col('--borde')}; o.scales.y.grid = {display: false};
  o.plugins.tooltip.callbacks = {label: c => ' ' + fmt(c.raw)};
  return {type: 'bar', data: {labels, datasets: [{data, backgroundColor: labels.map((l, i) => marcar[i] ? col('--ambar') : col('--cyan')), borderRadius: 4}]}, options: o};
}
function ordenadas(M, f) {           // barras ordenadas de empresas, con la del cliente en ámbar
  const filas = M.map(e => ({id: e.id, v: f(e)})).filter(x => x.v != null).sort((a, b) => a.v - b.v);
  return filas;
}
function configOrdenadas(filas, compacto, fmt, lineas) {
  const o = baseOpc(compacto); o.scales.x.ticks.display = false;
  o.plugins.tooltip.callbacks = {title: c => c[0].label === CLIENTE ? tuya : 'Otra empresa', label: c => ' ' + fmt(c.raw)};
  o.plugins.legend.display = true; o.plugins.legend.labels.filter = it => it.datasetIndex > 0;
  const ds = [{type: 'bar', order: 2, data: filas.map(f => f.v), backgroundColor: filas.map(f => f.id === CLIENTE ? col('--ambar') : col('--cyan')), borderRadius: 3}];
  (lineas || []).forEach((l, i) => ds.push({type: 'line', order: 1, label: l.label, data: filas.map(() => l.v), borderColor: i ? col('--azul') : col('--navy'), borderDash: i ? [5, 4] : [], borderWidth: 1.6, pointRadius: 0}));
  return {type: 'bar', data: {labels: filas.map(f => f.id), datasets: ds}, options: o};
}

function conteo(lista) { const n = vals(lista).length, c = {}; vals(lista).forEach(v => c[v] = (c[v] || 0) + 1); return Object.entries(c).map(([label, k]) => ({label, v: k / n})).sort((a, b) => b.v - a.v); }
function conteoProcesos(M) { const r = M.filter(e => (e.procesos || []).length); const c = {}; r.forEach(e => e.procesos.forEach(p => c[p] = (c[p] || 0) + 1)); return Object.entries(c).map(([k, n]) => ({k, label: PROCESO[k] || k, v: n / r.length})).sort((a, b) => b.v - a.v); }
function edadMercado(M) { const r = M.filter(e => e.edad.some(v => v != null)); const w = r.map(e => (e.op || 0) + (e.adm || 0) + (e.otro || 0)); const W = w.reduce((a, b) => a + b, 0); return [0, 1, 2, 3, 4].map(i => r.reduce((s, e, j) => s + (e.edad[i] || 0) * w[j], 0) / W); }
function rango(lista, v) { const a = vals(lista); return a.filter(x => x < v).length / a.length; }
function mesesMercado(M) { const r = M.filter(e => e.mes.some(x => x)); return MESES.map((_, i) => r.filter(e => e.mes[i]).length / r.length); }
function beneficiosMercado(M) { const r = M.filter(e => e.ben.some(x => x)); return DATOS.beneficios.map((label, i) => ({i, label: label.replace('Incremento en ', 'Incremento en '), v: r.filter(e => e.ben[i]).length / r.length})).filter(x => x.v > 0).sort((a, b) => b.v - a.v); }
function causasMercado(M) { const r = M.filter(e => e.mot.some(v => v != null)); return DATOS.motivos.map((label, i) => ({i, label, v: r.filter(e => (e.mot[i] ?? -1) >= 3).length / r.length})).sort((a, b) => b.v - a.v); }
function etapa(t) { if (!t) return null; if (/pendiente/i.test(t)) return 'Pendiente'; const m = t.match(/(20\d\d)/); if (m) return 'Revisado ' + m[1]; return 'No aplica'; }
function serieRot(M) { const total = [], nc = [], ct = []; DATOS.bimestres.forEach((_, i) => { const p = M.filter(e => (e.rot[i] ?? 0) > 0); total.push(prom(p.map(e => e.rot[i]))); nc.push(prom(p.map(e => e.rnc[i]))); ct.push(prom(p.map(e => e.rc[i]))); }); return {total, nc, ct}; }
function conteoTamano(M) { const n = M.length, c = {}; M.forEach(e => { const t = e.tamano || 'Sin dato'; c[t] = (c[t] || 0) + 1; }); return TAMANOS.filter(t => c[t]).map(t => ({label: t, v: c[t] / n})).concat(c['Sin dato'] ? [{label: 'Sin dato', v: c['Sin dato'] / n}] : []).sort((a, b) => b.v - a.v); }
function mixContratacion(lista) { const i = ULT; let cn = 0, cr = 0; lista.forEach(e => { cn += num(e.cn?.[i]) || 0; cr += num(e.cr?.[i]) || 0; }); const t = cn + cr || 1; return {cn, cr, total: t, pCn: cn / t, pCr: cr / t}; }
function puntosSalRot(M) { return M.filter(e => e.sal[0] != null && e.rot[ULT] != null).map(e => ({id: e.id, x: e.sal[0], y: e.rot[ULT]})); }
function puntosBubble(M) { return M.filter(e => e.rot[ULT] != null).map(e => { const head = (e.op || 0) + (e.adm || 0) + (e.otro || 0); return {id: e.id, x: head, y: e.rot[ULT], r: Math.max(6, Math.sqrt(head) * 1.2 + (e.aus[ULT] || 0) * 120)}; }); }
function percentilEnMuestra(lista, v, invertir) { const a = vals(lista); if (v == null || !a.length) return 0; const p = rango(a, v) * 100; return invertir ? 100 - p : p; }

  const defs = [['Rotación', e => e.rot[ULT], true], ['Ausentismo', e => e.aus[ULT], true], ['Salario inicial', e => e.sal[0], false], ['Incremento 2025', e => e.inc['2025'][0], false], ['Capacitación', e => e.cap, false]];
  const labels = defs.map(d => d[0]);
  const merc = defs.map(([, f, inv]) => percentilEnMuestra(M.map(f), prom(vals(M.map(f))), inv));
  const cli = defs.map(([, f, inv]) => percentilEnMuestra(M.map(f), f(CLI), inv));
  return {labels, merc, cli};
}
function matrizRotTierTam(M) {
  const tiers = [...new Set(vals(M.map(e => e.tier)))].sort();
  const celdas = [], valores = [];
  TAMANOS.forEach((tam, yi) => tiers.forEach((tier, xi) => {

    if (sub.length >= 2) { const v = prom(sub.map(e => e.rot[ULT])); celdas.push({x: xi, y: yi, v, tier, tam}); valores.push(v); }
  }));
  return {tiers, tamanos: TAMANOS, celdas, max: valores.length ? Math.max(...valores) : 0.15};
}

async function aplicarAccionResaltadoIA(action) {

    traceResaltadoIA('reject', { reason: 'invalid_action' });
    return { ok: false, status: 'rejected', error: 'Acción no válida' };
  }
  const t = action.target;
  const ref = {
    chartId: t.chartId,
    category: t.category,
    seriesKey: t.seriesKey != null ? String(t.seriesKey) : '',

    index: t.index,

  const mount = await asegurarCanvasGrafica(ref.chartId);
  traceResaltadoIA('mount', { chartId: ref.chartId, mount, ctx: obtenerContextoVisual() });

  if (puedePublicarResaltado()) {

      return { ok: false, status: 'failed', error: pub.error || 'No se pudo publicar' };

    refrescarResaltadoGraficos(true);
    const visual = graficoTieneResaltadoVisual(ref.chartId);
    traceResaltadoIA('applied', { global: true, visual, highlight: S.monitorHighlight });
    return visual
      ? { ok: true, status: 'applied', highlight: ref, global: true }
      : { ok: false, status: 'failed', error: 'El resaltado no se reflejó en la gráfica.' };
  }
  if (!mismoResaltado(S.monitorHighlight, ref)) S.monitorHighlight = ref;
  refrescarResaltadoGraficos(true);
  const visual = graficoTieneResaltadoVisual(ref.chartId);
  traceResaltadoIA('applied', { local: true, visual, highlight: S.monitorHighlight });

    ? { ok: true, status: 'applied', highlight: ref, local: true }

const graficos = new Map();
function dibujar(canvas, cfg) {
  const prev = graficos.get(canvas.id); if (prev) prev.destroy();
  const g = SECCIONES[+canvas.dataset.s].graficos[+canvas.dataset.g];
  const sinEje = ['doughnut', 'pie', 'scatter', 'bubble', 'radar', 'matrix'];
  if (!sinEje.includes(cfg.type)) cfg.options.interaction = {mode: 'nearest', intersect: false, axis: cfg.options.indexAxis === 'y' ? 'y' : 'x'};
  if (cfg.type === 'scatter' || cfg.type === 'bubble') cfg.options.interaction = {mode: 'nearest', intersect: true};
  const M = canvas.dataset.todo ? EMP : mercado().M;
  let clickTimer = null;
  cfg.options.onClick = (ev, els, chart) => {
    if (canvas.$catchDblLock) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      const el = els.length ? els[0] : elementoPrecisoEnEvento(chart, ev.native);
      if (!el) { cerrarFuente(); return; }
      const k = claveFuenteElemento(g, el);
      if (S.fuenteClave === k && $('#fuente')?.classList.contains('abierta')) { cerrarFuente(); return; }
      mostrarFuente(g, chart, el, M);
      marcarAperturaFuente();
    }, 240);
  };
  cfg.options.onHover = (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; };
  if (!cfg.options.animation) cfg.options.animation = modoPDF ? false : {duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 480, easing: 'easeOutCubic'};
  const chart = new Chart(canvas, cfg);
  canvas.ondblclick = (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    clearTimeout(clickTimer);
    canvas.$catchDblLock = true;
    cerrarFuente();
    const el = elementoPrecisoEnEvento(chart, ev);
    if (!puedePublicarResaltado()) {
      setTimeout(() => { canvas.$catchDblLock = false; }, 300);
      return;
    }
    if (!el) publicarResaltado(null);
    else {
      const ref = metaResaltadoDesdeElemento(g, chart, el);
      if (mismoResaltado(S.monitorHighlight, ref)) publicarResaltado(null);
      else publicarResaltado(ref);
    }
    setTimeout(() => { canvas.$catchDblLock = false; }, 300);
  };
  aplicarCapaResaltado(chart, g, false);
  graficos.set(canvas.id, chart);
}

function contarCifras(raiz) {   // la cifra grande cuenta desde 0: el único movimiento de la escena
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('[data-contar]').forEach(el => {
    const txt = el.dataset.contar; const m = txt.match(/[\d.,]+/); if (!m) return;
    const crudo = m[0], fin = parseFloat(crudo.replace(/,/g, '')); const dec = (crudo.split('.')[1] || '').length; const t0 = performance.now();
    const paso = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
      const n = (fin * e).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      el.textContent = txt.replace(crudo, crudo.includes(',') ? n : n.replace(/,/g, '')); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

let claridadAbierta = null;

function claridadStorageKey() {

function claridadRespondida(rol, s) {
  if (S.vistas[rol].resp[s]) return true;
  const key = claridadStorageKey();

  } catch (e) { return false; }
}
function marcarClaridadRespondida(rol, s) {
  S.vistas[rol].resp[s] = true;

  if (!key) return;
  try {

    map[String(s)] = true;
    localStorage.setItem(key, JSON.stringify(map));
  } catch (e) {}
}
function hidratarRespuestasClaridad() {
  const key = claridadStorageKey();
  if (!key) return;
  try {
    const map = JSON.parse(localStorage.getItem(key) || '{}');
    Object.entries(map).forEach(([s, ok]) => {
      if (!ok) return;
      S.vistas.cliente.resp[+s] = true;
      S.vistas.movil.resp[+s] = true;

  } catch (e) {}

  requestAnimationFrame(() => {
    claridadCola = null;

  document.querySelectorAll('#selVista button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.rol));
  const real = window.innerWidth < 600 && S.rol === 'movil';
  if (S.rol === 'moderador') renderModerador(app); else if (S.rol === 'cliente') renderCliente(app); else renderMovil(app, real);
  limpiarGraficos();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-tocar], [data-volver-anterior]'); if (!b) return;
  const d = b.dataset;
  if (d.v) { S.rol = d.v; history.replaceState(null, '', '#' + d.v); $('#capaModal').innerHTML = ''; render(); return; }
  if (d.mod) return moverModerador(S.pos + (+d.mod));
  if (d.flecha) return pasoFlecha(+d.flecha);
  if (d.modoGraf) { S.modoGraf = d.modoGraf; registrar('vista', d.modoGraf === 'tabla' ? 'Vio la tabla' : 'Vio el gráfico'); return render(); }
  if (d.enviarIa !== undefined) return enviarIA();
  if (d.volverAnterior !== undefined) {
    const pos = posVista(S.rol);
    const target = Math.max(0, pos - 1);
    if (S.rol === 'moderador') return moverModerador(target);
    const rol = S.rol === 'movil' ? 'movil' : 'cliente';
    const v = vistaParticipante(rol);
    if (v.live) entrarExploracion(rol, target);
    else { v.pos = acotarPosExploracion(rol, target); return render(); }
    return;
  }
  if (d.saltar !== undefined) return moverModerador(+d.saltar);
  if (d.tab) { S.tabMod = d.tab; return render(); }
  if (d.ir !== undefined) {
    if (S.rol !== 'cliente' || S.vistas.cliente.live) return;
    const sec = d.ir === 'inicio' ? -1 : +d.ir;
    if (sec > maxSeccionAutorizada()) return;
    const dest = d.ir === 'inicio' ? 0 : primerPaso(sec);
    const v = S.vistas.cliente;
    if (sec >= 0) v.exploreSection = sec;
    v.pos = acotarPosExploracion('cliente', dest >= 0 ? dest : 0);
    registrar('seccion', d.ir === 'inicio' ? 'Inicio' : SECCIONES[sec].nombre, sec);
    return render();
  }
  if (d.verDetalle !== undefined) {
    const [si, gi] = d.verDetalle.split('|').map(Number);
    if (S.rol === 'moderador') {
      if (abrirDetalleDesdeHoja(si, gi, 'preview')) return render();
      return;
    }
    if (S.rol === 'cliente' || S.rol === 'movil') {
      const rol = S.rol === 'movil' ? 'movil' : 'cliente';
      if (abrirDetalleDesdeHoja(si, gi, rol)) return render();
    }
    return;
  }
  if (d.volverHoja !== undefined) {
    if (S.rol === 'moderador') { S.peekPreview = null; return render(); }
    const rol = S.rol === 'movil' ? 'movil' : 'cliente';
    vistaParticipante(rol).peekExplica = null;
    return render();
  }
  if (d.explorar !== undefined) { if (S.rol === 'cliente') entrarExploracion('cliente', S.pos); return; }
  if (d.vivo !== undefined) {
    const rol = S.rol === 'movil' ? 'movil' : 'cliente';
    if (S.rol === 'moderador') return;
    return volverAlVivo(rol);
  }
  if (d.mv) {
    const v = S.vistas.movil;
    if (v.live) return;
    v.pos = acotarPosExploracion('movil', v.pos + (+d.mv));
    return render();
  }
  if (d.abrir === 'presentador') return abrirMenuPresentador();
  if (d.abrir === 'pregunta') return abrirPregunta();
  if (d.solicitarTurnoOral !== undefined) return void solicitarTurnoOralDirecto();
  if (d.abrir === 'ia') return abrirIA();
  if (d.iaEscalarAceptar) return void aceptarEscalamientoIA(decodeURIComponent(d.iaEscalarAceptar));
  if (d.iaEscalarRechazar !== undefined) return rechazarEscalamientoIA(b);
  if (d.colaAtendida) {
    void patchColaServidor(d.colaAtendida, { status: 'answered' }).then(ok => {
      if (!ok) patchColaLocal(d.colaAtendida, { status: 'attended' });
    });
    return;
  }
  if (d.colaDescartar) {
    void patchColaServidor(d.colaDescartar, { status: 'dismissed' }).then(ok => {
      if (!ok) patchColaLocal(d.colaDescartar, { status: 'dismissed' });
    });
    return;
  }
  if (d.abrir === 'glosario') { registrar('glosario', 'Abrió el glosario'); return abrirGlosario(seccionActual()); }
  if (d.glos) { registrar('glosario', d.glos); return abrirGlosario(seccionActual(), d.glos); }
  if (d.escuchar) { const [s, g] = d.escuchar.split('|').map(Number); return hablar(SECCIONES[s].graficos[g].texto(EMP)); }
  if (d.exportar !== undefined) return exportarPDF();
  if (d.avatar !== undefined) { S.avatar = !S.avatar; if (S.avatar) registrar('avatar', 'Abrió el avatar'); return render(); }
  if (d.escucharTexto !== undefined) return hablar(textoNarracion(PASOS[posVista(S.rol)]));
  if (d.cerrarFuente !== undefined) return cerrarFuente();
  if (d.responder) return abrirRespuesta(d.responder);
  if (d.borrador) return borradorIA(d.borrador);
  if (d.tocar && S.rol !== 'moderador') registrar('grafico', d.tocar);
});
document.addEventListener('click', e => {
  if (ignorarCierreFuente) return;
  if (!$('#fuente')?.classList.contains('abierta')) return;
  if (e.target.closest('#fuente')) return;
  if (e.target.closest('canvas')) return;
  cerrarFuente();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filtro) { filtros[t.dataset.filtro] = t.value; registrar('filtro', `${{tier: 'Tier', tamano: 'Tamaño', proceso: 'Proceso'}[t.dataset.filtro]} = ${t.dataset.filtro === 'proceso' && t.value !== 'Todos' ? PROCESO[t.value] : t.value}`); render(); }
  if (t.dataset.seguir !== undefined) {
    if (t.checked) volverAlVivo('movil', true);
    else entrarExploracion('movil', S.pos);
  }
});
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = 'es-MX'; u.rate = 1.02;
  const cara = document.querySelector('#cara'); cara && cara.classList.add('habla'); u.onend = () => document.querySelector('#cara')?.classList.remove('habla');
  speechSynthesis.speak(u);
}
// Navegación provisional con flechas (mientras la IA no conduce sola la presentación).
// Moderador, o cliente siguiendo en vivo: mueve la sesión para todos. Cliente explorando: solo su pantalla.
function pasoFlecha(d) {
  if (S.rol === 'moderador') return moverModerador(S.pos + d);
  const rol = S.rol === 'movil' ? 'movil' : 'cliente';
  const v = vistaParticipante(rol);
  if (v.live) return;
  v.pos = acotarPosExploracion(rol, v.pos + d);
  render();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'inIA') { e.preventDefault(); return enviarIA(); }
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.target.closest('input, textarea, select') || $('#capaModal').innerHTML || S.rol === 'movil') return;
  e.preventDefault(); pasoFlecha(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', () => { S.rol = vistaDesdeHash(); render(); });
Chart.defaults.font.family = 'Urbanist, "Segoe UI", system-ui, sans-serif';
hidratarRespuestasClaridad();
S.rol = vistaDesdeHash(); render(); pintarSync(); conectarSala();
