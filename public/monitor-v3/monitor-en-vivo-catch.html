<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor en vivo · Catch Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Paleta y tipografía del demo "Capital Humano Live" de Catch */
:root{
  --navy:#5B9BD5; --azul:#2778B1; --cyan:#38AECB; --cielo:#EEF5FA; --ambar:#F2C879; --vivo:#E0453A; --profundo:#1B4F7A; --gris-azul:#C9D6E2;
  --fondo:#FFFFFF; --superficie:#FFFFFF; --pista:#F7F9FB; --borde:#E6E7E8; --tinta:#232222; --suave:#5B6168; --rail1:#0B5FB4; --rail2:#1B86DA;
  --display:'Comfortaa','Nunito Sans',system-ui,sans-serif; --texto:'Nunito Sans','Helvetica Neue',system-ui,sans-serif;
  --catch-avatar-fab-clearance: calc(56px + 20px + 16px + env(safe-area-inset-bottom, 0px));
  color-scheme: light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#A9CBEA; --azul:#6FB0E3; --cyan:#5CC6DE; --cielo:#132233; --ambar:#F0B657; --fondo:#0E1823; --superficie:#121F2D; --pista:#16263A; --borde:#24364A; --tinta:#EEF2F6; --suave:#A5B1BE; --rail1:#0A3D78; --rail2:#0F5AA6; color-scheme:dark; } }
:root[data-theme="dark"]{ --navy:#A9CBEA; --azul:#6FB0E3; --cyan:#5CC6DE; --cielo:#132233; --ambar:#F0B657; --fondo:#0E1823; --superficie:#121F2D; --pista:#16263A; --borde:#24364A; --tinta:#EEF2F6; --suave:#A5B1BE; --rail1:#0A3D78; --rail2:#0F5AA6; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--fondo); color:var(--tinta); font:16px/1.5 var(--texto); font-variant-numeric:tabular-nums}
button,select,textarea,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
.oculto{display:none!important}
html.catch-embed .demo{display:none!important}
h1,h2,h3{font-family:var(--display); letter-spacing:-.01em}

/* barra de demo para elegir la vista */
.demo{position:relative; z-index:60; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 18px; background:var(--superficie); border-bottom:1px solid var(--borde); font-size:13px; color:var(--suave)}
.demo strong{color:var(--tinta); font-family:var(--display)}
.seg{display:inline-flex; background:var(--pista); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; padding:5px 14px; border-radius:999px; color:var(--suave)}
.seg button[aria-pressed="true"]{background:var(--superficie); color:var(--azul); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08)}
.estado-sync{margin-left:auto}
.punto{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--borde); margin-right:6px; vertical-align:middle}
.punto.vivo{background:var(--vivo); animation:parpadeo 1.6s infinite}
@keyframes parpadeo{50%{opacity:.35}}

/* ===== pantalla del cliente ===== */
.cliente{display:grid; grid-template-columns:232px 1fr; min-height:calc(100vh - 46px); align-items:stretch}
.rail{background:var(--profundo); color:#fff; border-right:1px solid rgba(255,255,255,.12); padding:24px 14px; display:flex; flex-direction:column; gap:4px; min-height:calc(100vh - 46px); align-self:stretch; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.55) rgba(255,255,255,.08)}
.rail .marca{font-family:var(--display); font-size:30px; font-weight:700; margin:2px 10px 22px; color:#fff}
.rail .marca small{display:block; font-family:var(--texto); font-size:11px; font-weight:600; letter-spacing:4px; color:#bfe3f0}
.rail button{display:flex; align-items:center; gap:12px; border:0; background:transparent; color:rgba(255,255,255,.72); padding:11px 12px; border-radius:12px; text-align:left; font-weight:600; transition:background .2s, color .2s}
.rail button:hover{background:rgba(255,255,255,.08); color:#fff}
.rail button svg{flex:none; width:22px; height:22px; color:#7fd3e6}
.rail button[aria-current="true"]{background:rgba(56,174,203,.2); color:#bfe3f0}
.rail button[aria-current="true"] svg{color:#bfe3f0}
.rail button .avance{margin-left:auto; font-size:12px; opacity:.9; color:#bfe3f0}
.rail .pie{margin-top:auto; font-size:12px; color:rgba(255,255,255,.55); padding:0 10px}
.rail-cabeza-movil span{color:#fff}
.escena{display:flex; flex-direction:column; min-width:0; background:var(--fondo)}
.cabeza{display:flex; align-items:center; gap:16px; padding:22px 40px 10px}
.cabeza h1{margin:2px 0 0; font-size:30px; color:var(--tinta); font-weight:700}
.cabeza .ruta{color:var(--azul); font-size:14px; font-weight:700}
.cabeza .derecha,.cabeza-acciones{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.cabeza-principal{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 5rem}
.titulo-monitor{display:inline; font-weight:400; font-size:15px; color:var(--suave); line-height:1.3}
.edicion-monitor{display:inline; font-size:15px; color:var(--suave)}
.edicion-monitor::before{content:" · "}
.btn-menu,.nav-velo,.rail-cabeza-movil{display:none}
.btn-menu{flex:none; width:44px; height:44px; border:1px solid var(--borde); border-radius:12px; background:var(--superficie); align-items:center; justify-content:center; padding:0}
.btn-menu-ico,.btn-menu-ico::before,.btn-menu-ico::after{display:block; width:18px; height:2px; background:var(--azul); border-radius:1px; position:relative}
.btn-menu-ico::before,.btn-menu-ico::after{content:""; position:absolute; left:0}
.btn-menu-ico::before{top:-6px}
.btn-menu-ico::after{top:6px}
.btn{border:1px solid var(--borde); background:var(--superficie); padding:8px 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--tinta); transition:border-color .2s, transform .2s}
.btn:hover{border-color:var(--azul)}
.btn.prim{background:var(--azul); color:#fff; border-color:var(--azul)}
.btn.suave{background:var(--cielo); border-color:transparent; color:var(--azul)}
.btn.texto{border-color:transparent; background:transparent; color:var(--suave); padding:8px 10px}
.btn.texto:hover{color:var(--azul)}
.btn.flecha{width:40px; height:40px; padding:0; font-size:20px; line-height:1; display:inline-grid; place-items:center}
.cuerpo{padding:12px 40px 40px; flex:1; min-width:0}

/* avance de la sección */
.recorrido{display:flex; gap:6px; align-items:center; margin-bottom:22px}
.recorrido span{height:4px; border-radius:4px; background:var(--borde); width:38px; transition:all .3s}
.recorrido span.hecho{background:var(--cyan)}
.recorrido span.actual{background:var(--azul); width:64px}
.recorrido em{font-style:normal; color:var(--suave); font-size:13px; margin-left:10px}

/* escena de explicación: cifra a la izquierda, gráfico interactivo a la derecha */
.explica{display:grid; grid-template-columns:minmax(300px,.9fr) minmax(0,1.3fr); gap:56px; align-items:start; min-height:58vh}
.copia .kicker{color:var(--azul); font-size:15px; font-weight:800; letter-spacing:.01em; margin:0 0 8px}
.grande{font-family:var(--display); font-weight:700; font-size:clamp(64px,7.5vw,116px); line-height:1; letter-spacing:-.04em; color:var(--azul); margin:0}
.grande-lab{font-size:18px; color:var(--suave); margin:8px 0 22px}
.copia .lede{font-size:21px; line-height:1.5; margin:0 0 26px; max-width:34ch}
.copia .lede strong{color:var(--tinta); font-weight:800}
.stats{display:flex; flex-wrap:wrap; gap:36px; border-top:1px solid var(--borde)}
.stats div{display:flex; flex-direction:column; gap:2px; padding-top:14px}
.stats strong{font-family:var(--display); font-size:26px; color:var(--tinta)}
.stats div.tuya strong{color:var(--azul)}
.stats div.tuya strong::before,.kpi.tuya b::before{content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ambar); margin-right:8px; vertical-align:middle}
.stats span{font-size:13px; color:var(--suave)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:22px}
.chip{border:1px solid var(--borde); color:var(--suave); background:transparent; border-radius:999px; padding:4px 12px; font-size:13px}
.chip:hover{border-color:var(--azul); color:var(--azul)}
.grafico .tit{font-size:14px; color:var(--suave); margin:0 0 4px; display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.grafico .tit b{color:var(--tinta); font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em; line-height:1.15}
.grafico .nota-graf{margin:0 0 10px; color:var(--suave); font-size:14px; line-height:1.35}
.paquete{width:100%}
.paquete table{width:100%; border-collapse:collapse}
.paquete th,.paquete td{text-align:left; padding:12px 8px; border-bottom:1px solid var(--borde)}
.paquete th{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--suave)}
.paquete td{font-size:16px}
.paquete td.num{font-family:var(--display); font-size:22px; color:var(--azul); text-align:right; white-space:nowrap}
.lienzo{position:relative; height:400px}
.toca{font-size:12.5px; color:var(--suave)}

/* hoja completa */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; margin-bottom:28px; border-top:1px solid var(--borde)}
.kpi{padding:16px 18px 4px 0}
.kpi b{display:block; font-family:var(--display); font-size:34px; color:var(--azul); font-weight:700; letter-spacing:-.02em}
.kpi span{font-size:13px; color:var(--suave)}
.kpi.tuya b{color:var(--azul)}
.hoja{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px 48px}
.hoja .celda{animation:aparece .55s both}
.hoja .celda:nth-child(2){animation-delay:.07s}.hoja .celda:nth-child(3){animation-delay:.14s}.hoja .celda:nth-child(4){animation-delay:.21s}
@keyframes aparece{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.celda h2{margin:0; font-size:22px; font-family:var(--display); color:var(--tinta); letter-spacing:-.02em; line-height:1.15}
.celda .sub{margin:2px 0 10px; color:var(--suave); font-size:13px}
.hoja .lienzo--hoja{height:clamp(150px,20vh,210px); min-height:140px}
.hoja--preview{gap:18px 22px; grid-template-columns:repeat(2,minmax(0,1fr))}
.hoja--preview .lienzo--hoja{height:118px; min-height:100px}
.hoja--preview .celda--hoja h2{font-size:14px; line-height:1.25}
.hoja--preview .celda--hoja .sub{font-size:11px; margin-bottom:6px}
.hoja--preview .btn-detalle{font-size:11px; padding:4px 10px; min-height:28px}
.celda--hoja{border:1px solid var(--borde); border-radius:14px; padding:14px 16px 12px; background:var(--superficie); display:flex; flex-direction:column}
.celda--hoja .lienzo{flex:1}
.hoja-detalle-nav{margin-bottom:16px}
.hoja .celda .btn-detalle{margin-top:auto; align-self:flex-start}
.filtros{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:22px; font-size:14px}
.filtros label{color:var(--suave); display:flex; gap:6px; align-items:center}
.filtros select{border:1px solid var(--borde); background:var(--superficie); border-radius:999px; padding:5px 12px}
.aviso{font-size:13px; color:var(--vivo)}
.leyenda-tuya{font-size:13px; color:var(--suave)}
.leyenda-tuya i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ambar); margin-right:5px}
.portada{max-width:900px; padding-top:0}
.portada .grande{font-size:clamp(44px,5vw,72px); color:var(--tinta); letter-spacing:-.03em}
.portada p.lede{font-size:21px; color:var(--suave); max-width:46ch; margin:18px 0 36px}
.agenda{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border-top:1px solid var(--borde)}
.agenda div{padding:16px 18px 0 0}
.agenda b{display:block; font-family:var(--display); color:var(--azul); font-size:18px; margin-bottom:4px}
.agenda span{font-size:14px; color:var(--tinta); line-height:1.35}
.agenda small{display:block; margin-top:4px; font-size:13px; color:var(--suave)}
.portada--numero .grande{font-size:clamp(72px,8vw,120px); color:var(--azul)}
.nota-anon{font-size:13px; color:var(--suave)}

/* justificación del dato (panel inferior) */
.fuente{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px); width:min(760px,calc(100vw - 32px)); background:var(--superficie); border:1px solid var(--borde); border-radius:18px; padding:18px 22px; box-shadow:0 18px 50px rgba(27,79,122,.18); z-index:40; opacity:0; visibility:hidden; transition:all .25s}
.fuente.abierta{opacity:1; visibility:visible; transform:translate(-50%,0)}
.fuente .cab{display:flex; align-items:baseline; gap:12px}
.fuente .cab h3{margin:0; font-size:15px; color:var(--suave); font-family:var(--texto); font-weight:700}
.fuente .cab button{margin-left:auto}
.fuente .valor{font-family:var(--display); font-size:30px; color:var(--azul); margin:4px 0 10px}
.fuente dl{display:grid; grid-template-columns:150px 1fr; gap:6px 16px; margin:0; font-size:14px}
.fuente dt{color:var(--suave)}
.fuente dd{margin:0}

/* avatar desplegable */
.avatar-w{position:fixed; right:24px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:45; display:flex; flex-direction:column; align-items:flex-end; gap:12px}
.avatar-w--left{left:24px; right:auto; align-items:flex-start}
.avatar-w--visitante{z-index:44}
.avatar-w--panel-open .avatar-audio-peek{display:none}
.avatar-w:not(.avatar-w--panel-open) .panel-av .avatar-tavus-bar,
.avatar-w:not(.avatar-w--panel-open) .panel-av .dentro,
.avatar-w:not(.avatar-w--panel-open) .panel-av--visitante .cliente-avatar-en-vivo__cab,
.avatar-w:not(.avatar-w--panel-open) .panel-av .video .avatar-video-media,
.avatar-w:not(.avatar-w--panel-open) .panel-av .video .panel-av__dock{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.avatar-w:not(.avatar-w--panel-open) .panel-av{width:auto;max-width:min(320px,calc(100vw - 32px));background:var(--superficie);border:1px solid var(--borde);border-radius:16px;box-shadow:0 8px 24px rgba(39,120,177,.12);margin-bottom:10px;overflow:visible}
.avatar-w:not(.avatar-w--panel-open) .panel-av .video{aspect-ratio:auto;height:auto;min-height:0;background:transparent}
.avatar-w:not(.avatar-w--panel-open) .avatar-audio-peek,
.avatar-w:not(.avatar-w--panel-open) .panel-av__dock--solo-audio{display:flex}
.avatar-audio-peek{display:none;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--borde);background:var(--superficie)}
.avatar-rail:not(.avatar-rail--open) .avatar-tavus-bar,
.avatar-rail:not(.avatar-rail--open) .avatar-video-media{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.avatar-rail:not(.avatar-rail--open) .video .audio-ctrl{display:flex}
.avatar-rail:not(.avatar-rail--open) .video{aspect-ratio:auto;min-height:0}
.fab{min-height:56px; padding:0 22px 0 16px; border-radius:999px; border:0; color:#fff; font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,var(--azul),var(--cyan)); box-shadow:0 8px 24px rgba(39,120,177,.3); transition:transform .2s, box-shadow .2s}
.fab:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(39,120,177,.4)}
.fab .pulso{position:relative; width:12px; height:12px; border-radius:50%; background:#fff}
.fab .pulso::after{content:""; position:absolute; inset:0; border-radius:50%; background:#fff; animation:aiPulse 1.6s infinite}
@keyframes aiPulse{0%{transform:scale(1); opacity:.7}100%{transform:scale(2.2); opacity:0}}
.panel-av{width:min(380px,calc(100vw - 32px)); background:#FFFFFF; color:var(--tinta); border:1px solid var(--borde); border-radius:20px; overflow:hidden; box-shadow:0 16px 40px rgba(39,120,177,.16); transform-origin:bottom right; animation:abre .22s both}
.avatar-w--left .panel-av{transform-origin:bottom left}
.panel-av .video{position:relative}
.panel-av__dock{position:absolute; left:10px; bottom:10px; z-index:6; display:flex; flex-wrap:wrap; align-items:center; gap:6px; max-width:calc(100% - 20px); pointer-events:auto}
.panel-av__dock .dock-btn{border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.94); color:var(--azul); border-radius:999px; padding:6px 11px; font-weight:700; font-size:12px; cursor:pointer; box-shadow:0 2px 10px rgba(15,47,72,.25)}
.panel-av__dock .dock-btn.lleno{background:var(--azul); color:#fff; border-color:var(--azul)}
.panel-av__dock .btn-mic{min-width:40px; min-height:40px; padding:0; border-radius:50%; box-shadow:0 2px 10px rgba(15,47,72,.25); border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.94); color:var(--azul); display:inline-flex; align-items:center; justify-content:center; position:relative}
.panel-av__dock .btn-mic.escuchando{color:#fff; background:linear-gradient(145deg,var(--azul),var(--cyan)); border-color:transparent}
.panel-av__dock .btn-mic .ia-mic-ico{display:flex; width:20px; height:20px}
.panel-av__dock .btn-mic.escuchando .ia-mic-ico{display:none}
.panel-av__dock .btn-mic .ia-mic-barras{display:none}
.panel-av__dock .btn-mic.escuchando .ia-mic-barras{display:flex}
.panel-av__dock--solo-audio{position:static; left:auto; bottom:auto; padding:9px 12px; border-top:1px solid var(--borde); background:var(--superficie); max-width:none; box-shadow:none}
.panel-av__dock--solo-audio button,.panel-av__dock--solo-audio input[type=range]{pointer-events:auto}
.panel-av--visitante.cliente-avatar-en-vivo{margin:0; border-radius:20px}
.panel-av__gemini-opts{display:flex; flex-direction:column; gap:8px; margin-top:12px; font-size:12px}
.panel-av__gemini-opts label{display:flex; align-items:flex-start; gap:8px; line-height:1.35; cursor:pointer}
.panel-av__dock .dock-btn--teclado{min-width:40px; padding:6px 12px; font-size:16px; line-height:1}
@keyframes abre{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1; transform:none}}
.panel-av .video{aspect-ratio:16/9; background:#0f2f48; padding:0; display:block}
.panel-av .avatar-video{width:100%; height:100%; object-fit:cover; display:block; aspect-ratio:16/9}
.panel-av .video .cara{width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#E3F5FA,#9FDCEB 55%,#5CC6DE); margin:0 auto 8px; position:relative}
.panel-av .video .cara.habla::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid #7FD3E6; animation:aiPulse 1.2s infinite}
.panel-av .audio-ctrl{display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--borde); background:var(--superficie)}
.panel-av .audio-ctrl button{border:0; background:transparent; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1}
.panel-av .audio-ctrl input[type=range]{flex:1; min-width:0; accent-color:var(--azul)}
.panel-av .dentro{padding:14px 16px 16px}
.panel-av .dentro p{margin:0 0 12px; font-size:15px; line-height:1.5}
.panel-av .acc{display:flex; gap:8px; flex-wrap:wrap}
.panel-av .acc button{border:1px solid var(--borde); background:#FFFFFF; color:var(--azul); border-radius:999px; padding:6px 12px; font-weight:700; font-size:13px}
.panel-av .acc button.lleno{background:var(--azul); color:#fff; border-color:var(--azul)}

/* ventanas */
.velo{position:fixed; inset:0; background:rgba(35,34,34,.28); display:grid; place-items:center; z-index:50; padding:20px}
.modal{background:var(--superficie); border-radius:20px; padding:26px; width:min(520px,100%); border:1px solid var(--borde); box-shadow:0 24px 60px rgba(27,79,122,.18); animation:abre .2s both}
.modal h3{margin:0 0 6px; color:var(--tinta); font-size:22px}
.modal p{margin:0 0 16px; color:var(--suave)}
.opciones{display:grid; gap:8px}
.opciones button{text-align:left; border:1px solid var(--borde); background:var(--superficie); border-radius:14px; padding:13px 16px; font-weight:700}
.opciones button:hover{border-color:var(--azul)}
.opciones button small{display:block; font-weight:400; color:var(--suave)}
textarea{width:100%; min-height:90px; border:1px solid var(--borde); background:var(--pista); border-radius:12px; padding:10px 12px; resize:vertical}
.fila{display:flex; gap:8px; justify-content:flex-end; margin-top:12px}
.glosario dt{font-weight:800; color:var(--azul); margin-top:12px}
.glosario dd{margin:2px 0 0}
.chat{display:flex; flex-direction:column; gap:8px; max-height:300px; overflow:auto; margin-bottom:10px}
.msg{padding:9px 13px; border-radius:14px; max-width:90%}
.msg.yo{background:var(--cielo); align-self:flex-end}
.msg.ia{background:var(--pista)}

/* ===== moderador ===== */
.moderador{display:grid; grid-template-columns:270px minmax(0,1fr) 350px; height:calc(100vh - 46px); max-height:calc(100vh - 46px); min-height:0; align-items:stretch; background:var(--fondo); overflow:hidden}
html.catch-embed .moderador{height:100dvh; max-height:100dvh}
body:has(.moderador){overflow:hidden}
.mod-col{min-height:0; max-height:100%; align-self:stretch; overflow-x:hidden; overflow-y:auto}
.mod-col:first-child{background:var(--profundo); color:#fff; border-right:1px solid rgba(255,255,255,.12); scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.55) rgba(255,255,255,.08)}
.mod-col:last-child{background:var(--superficie); color:var(--tinta); border-right:0; border-left:1px solid var(--borde); scrollbar-width:thin; scrollbar-color:rgba(39,120,177,.5) rgba(39,120,177,.1)}
.mod-col:first-child::-webkit-scrollbar,.rail::-webkit-scrollbar,.pasos::-webkit-scrollbar{width:8px}
.mod-col:first-child::-webkit-scrollbar-track,.rail::-webkit-scrollbar-track,.pasos::-webkit-scrollbar-track{margin:10px 0; background:rgba(255,255,255,.07); border-radius:999px}
.mod-col:first-child::-webkit-scrollbar-thumb,.rail::-webkit-scrollbar-thumb,.pasos::-webkit-scrollbar-thumb{background:rgba(255,255,255,.42); border-radius:999px; border:2px solid transparent; background-clip:padding-box}
.mod-col:last-child::-webkit-scrollbar,.mod-centro::-webkit-scrollbar,.prep-faq-lista::-webkit-scrollbar{width:8px}
.mod-col:last-child::-webkit-scrollbar-track,.mod-centro::-webkit-scrollbar-track,.prep-faq-lista::-webkit-scrollbar-track{margin:10px 0; background:rgba(39,120,177,.08); border-radius:999px}
.mod-col:last-child::-webkit-scrollbar-thumb,.mod-centro::-webkit-scrollbar-thumb,.prep-faq-lista::-webkit-scrollbar-thumb{background:rgba(39,120,177,.38); border-radius:999px; border:2px solid transparent; background-clip:padding-box}
.mod-col:first-child h3{margin:0; padding:18px 18px 8px; font-size:12.5px; font-weight:700; letter-spacing:.02em; color:#bfe3f0; font-family:var(--texto)}
.mod-col:last-child h3{margin:0; padding:18px 18px 8px; font-size:12.5px; font-weight:700; letter-spacing:.02em; color:var(--azul); font-family:var(--texto)}
.pasos{list-style:none; margin:0; padding:0 10px 18px}
.moderador > .mod-col:first-child .pasos{padding-bottom:80px}
.pasos .grupo{padding:14px 8px 6px; font-weight:800; color:#fff; font-size:15px; line-height:1.25}
.pasos .grupo small{display:block; font-weight:500; font-size:12px; color:rgba(255,255,255,.62); margin-top:2px}
.pasos button{width:100%; text-align:left; border:0; background:transparent; padding:6px 10px; border-radius:10px; font-size:14px; color:rgba(255,255,255,.72); display:flex; gap:8px; align-items:center}
.pasos button:hover{color:#fff; background:rgba(255,255,255,.06)}
.pasos button[aria-current="true"]{background:rgba(56,174,203,.2); color:#bfe3f0; font-weight:700}
.pasos button .ok{margin-left:auto; font-size:12px; color:#7fd3e6}
.mod-centro{padding:20px 26px; overflow-x:hidden; overflow-y:auto; min-height:0; max-height:100%; align-self:stretch; background:var(--pista); scrollbar-width:thin; scrollbar-color:rgba(39,120,177,.5) rgba(39,120,177,.1)}
.mod-centro .titulo{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.mod-centro .titulo h2{margin:0; font-family:var(--display); font-size:clamp(26px,2.2vw,34px); line-height:1.15; letter-spacing:-.02em}
.pantalla{border:1px solid var(--borde); border-radius:16px; overflow:hidden; background:var(--superficie); transition:background .45s ease, box-shadow .45s ease, border-color .45s ease}
.pantalla--cliente-preview.pantalla--modo-edicion-sim{background:#FFFFFF; border-color:rgba(39,120,177,.28); box-shadow:0 0 0 1px rgba(39,120,177,.1), 0 10px 28px rgba(39,120,177,.09)}
.pantalla .barra{display:flex; justify-content:space-between; padding:8px 14px; font-size:12px; color:var(--suave); border-bottom:1px solid var(--borde); transition:background .45s ease, border-color .45s ease}
.pantalla--modo-edicion-sim .barra--cliente-preview{background:rgba(39,120,177,.05); border-bottom-color:rgba(39,120,177,.16)}
.pantalla--cliente-preview > .dentro#mod-preview{transition:background .45s ease, box-shadow .45s ease}
.pantalla--cliente-preview.pantalla--modo-edicion-sim > .dentro#mod-preview{background:rgba(39,120,177,.13); box-shadow:inset 0 0 0 1px rgba(39,120,177,.16)}
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .explica,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .portada,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .copia,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .hoja,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .central{transition:background .45s ease}
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .explica .copia,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview .portada,
.pantalla--cliente-preview.pantalla--modo-edicion-sim #mod-preview > .copia{background:rgba(255,255,255,.38); border-radius:12px}
.pantalla .barra--cliente-preview{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; padding:10px 14px}
.barra-cli-izq{justify-self:start}
.barra-cli-centro{grid-column:2; justify-self:center; text-align:center; font-size:12px; font-weight:700; color:var(--tinta)}
.btn-modo-edicion-sim{justify-self:end; grid-column:3; border-radius:999px; padding:6px 14px; font-size:12px; font-weight:700; border:1px solid rgba(39,120,177,.22); background:rgba(39,120,177,.13); color:var(--azul); transition:background .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease}
.btn-modo-edicion-sim:hover{background:rgba(39,120,177,.2)}
.btn-modo-edicion-sim.is-activo{background:var(--azul); color:#fff; border-color:var(--azul); box-shadow:0 2px 10px rgba(39,120,177,.28)}
.pantalla .dentro{padding:20px 22px}
.pantalla .explica{min-height:0; gap:28px}
.pantalla .titular{font-size:clamp(22px,2vw,30px); margin-bottom:6px}
.pantalla .grande{font-size:64px}
.pantalla .copia .lede{font-size:16px; line-height:1.45}
.pantalla .lienzo{height:270px}
.pantalla .hoja{gap:22px 28px}
.pantalla .hoja .lienzo{height:170px}
.pantalla .kpi b{font-size:24px}
.pantalla .portada .grande{font-size:38px}
.pantalla .portada--numero .grande{font-size:72px; color:var(--azul)}
.pantalla .agenda{grid-template-columns:repeat(2,1fr)}
.controles{display:flex; gap:8px; align-items:center; margin:16px 0; flex-wrap:wrap}
.controles .siguiente{margin-left:auto; color:var(--suave); font-size:13px}
.notas{background:var(--superficie); border:1px solid var(--borde); border-radius:16px; padding:16px 18px}
.notas h4{margin:0 0 6px; font-family:var(--display)}
.tabs{display:flex; border-bottom:1px solid var(--borde); position:sticky; top:0; background:var(--superficie); z-index:2}
.tabs button{flex:1; border:0; background:transparent; padding:14px 6px; font-weight:700; color:var(--suave); border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--azul); border-bottom-color:var(--cyan); background:var(--cielo)}
.badge{display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--vivo); color:#fff; font-size:12px; margin-left:4px}
.lista{padding:14px 16px; display:grid; gap:12px}
.pregunta{border:1px solid var(--borde); border-radius:14px; padding:12px 14px; background:var(--superficie); color:var(--tinta)}
.pregunta .meta{font-size:12px; color:var(--suave); margin-bottom:4px}
.pregunta .acc{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.pregunta.respondida,.pregunta.atendida,.pregunta.descartada{opacity:.72}
.pregunta--oral{border-color:var(--vivo); border-width:2px}
.pregunta .cola-tipo{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--azul); margin-bottom:6px}
.pregunta .cola-tipo--oral{color:var(--vivo)}
.pregunta .resp{margin-top:8px; padding:8px 10px; border-left:2px solid var(--cyan); background:var(--cielo); font-size:14px; color:var(--tinta)}
.ia-cola-acc{margin-top:10px; gap:8px; flex-wrap:wrap}
.ia-escala-oferta{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--cielo); border:1px solid var(--borde)}
.ia-escala-oferta .ia-escala-preg{font-size:13px; color:var(--suave); margin:0 0 10px; font-style:italic}
.ia-escala-ok{margin-top:10px; font-size:14px; color:var(--azul); font-weight:600}
.menu-presentador{display:grid; gap:12px; margin-top:8px}
.menu-presentador .opcion-presentador{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:1px solid var(--borde); border-radius:14px; padding:14px 16px; background:var(--superficie); cursor:pointer; font:inherit; color:inherit}
.menu-presentador .opcion-presentador:hover{border-color:var(--cyan); background:var(--cielo)}
.menu-presentador .opcion-presentador strong{display:block; font-size:15px; margin-bottom:4px}
.menu-presentador .opcion-presentador small{display:block; font-size:12.5px; color:var(--suave); line-height:1.35}
.menu-presentador .opcion-presentador .ico{flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--pista); color:var(--azul)}
.menu-presentador .opcion-presentador--oral .ico{background:#fff0f0; color:var(--vivo)}
.menu-presentador .opcion-presentador .ico svg{width:22px; height:22px}
.confirm-turno{text-align:center; padding:8px 0}
.confirm-turno .ok-mark{font-size:42px; line-height:1; color:var(--cyan); margin-bottom:8px}
.barra-h{display:grid; grid-template-columns:1fr 40px; gap:6px; align-items:center; font-size:13.5px; margin:8px 0}
.barra-h .pista{height:6px; border-radius:6px; background:var(--pista); overflow:hidden; grid-column:1/-1}
.barra-h .pista i{display:block; height:100%; background:var(--cyan)}
.sugerencia{background:var(--cielo); border-radius:14px; padding:12px 14px; font-size:14px}
.vacio{color:var(--suave); font-size:14px; padding:6px 2px}
.mod-col:first-child .vacio,.mod-col:first-child .panel-rail-seccion .vacio{color:rgba(255,255,255,.88)}
.mod-col:first-child .panel-rail-seccion h4{color:#bfe3f0; font-size:12.5px; font-weight:700; letter-spacing:.02em}
.lista .vacio{color:var(--suave)}

/* ===== celular ===== */
.movil-marco{display:flex; justify-content:center; padding:22px; background:var(--pista); min-height:calc(100vh - 46px)}
.movil{width:min(400px,100%); background:var(--superficie); border:1px solid var(--borde); border-radius:30px; overflow:hidden; display:flex; flex-direction:column; min-height:760px; box-shadow:0 18px 50px rgba(27,79,122,.12); position:relative}
.movil.real{border-radius:0; border:0; box-shadow:none; width:100%; min-height:100vh}
.movil header{padding:18px 20px 8px; border-bottom:1px solid var(--borde)}
.movil header .linea{display:flex; justify-content:space-between; font-size:12.5px; color:var(--suave)}
.movil header h2{margin:6px 0 0; font-size:20px; color:var(--azul)}
.movil header p{margin:2px 0 0; font-size:13px; color:var(--suave)}
.movil .contenido{padding:18px 20px; flex:1; overflow:auto}
.movil .grande{font-size:64px}
.movil .copia .lede{font-size:17px; margin-bottom:16px}
.movil .lienzo{height:240px}
.movil .stats{gap:22px}
.movil .stats strong{font-size:21px}
.movil .acciones{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px; border-top:1px solid var(--borde); background:var(--superficie); position:sticky; bottom:0}
.movil .acciones button{border:1px solid var(--borde); background:var(--superficie); border-radius:14px; padding:10px 6px; font-size:13px; font-weight:700; color:var(--azul)}
.interruptor{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--suave); margin-bottom:12px}

@media (max-width:1180px){ .moderador{grid-template-columns:230px minmax(0,1fr)} .moderador .mod-col:last-child{grid-column:1/-1; border-left:0; border-top:1px solid var(--borde); max-height:none} .explica{gap:32px} }
@media (max-width:900px){ .cliente{grid-template-columns:1fr}
  .btn-menu{display:inline-flex}
  .rail-cabeza-movil{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 4px 12px; font-weight:700; color:var(--profundo)}
  .cliente .rail{position:fixed; top:0; left:0; bottom:0; width:min(288px,88vw); max-width:100%; height:100dvh; z-index:80; flex-direction:column; overflow:auto; padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-110%); transition:transform .2s ease; box-shadow:none; background:var(--profundo); border-right:1px solid rgba(255,255,255,.12)}
  .cliente.menu-secciones-abierto .rail{transform:none; box-shadow:12px 0 40px rgba(27,79,122,.2)}
  .nav-velo{display:none; position:fixed; inset:0; z-index:75; width:100%; height:100%; border:0; padding:0; margin:0; background:rgba(15,47,72,.35); border-radius:0}
  .cliente.menu-secciones-abierto .nav-velo{display:block}
  .cliente .cabeza{flex-direction:column; align-items:stretch; gap:10px; padding:12px 16px 8px}
  .cliente .cabeza-acciones{margin-left:0; width:100%; justify-content:flex-start}
  .cliente .cabeza .paso,.cliente .cabeza .btn.flecha{display:none}
  .titulo-monitor{display:block; font-weight:700; font-size:16px; color:var(--tinta)}
  .edicion-monitor{display:block; font-size:12px; line-height:1.35}
  .edicion-monitor::before{content:none}
  .cliente .cuerpo{padding:10px 16px calc(20px + var(--catch-avatar-fab-clearance)); scroll-padding-bottom:var(--catch-avatar-fab-clearance)}
  .explica,.hoja{grid-template-columns:1fr} .agenda{grid-template-columns:repeat(2,1fr)} .moderador{grid-template-columns:1fr} .mod-col{max-height:none} .cabeza{padding:16px 18px 6px} .cuerpo{padding:10px 18px 90px} }
/* ===== zona central del cliente, estructura del demo "Capital Humano Live" ===== */
.cliente .escena{min-height:calc(100vh - 46px)}
.cliente .cabeza{padding:18px 40px 8px}
.cabeza .contexto{font-size:15px; color:var(--suave)}
.cabeza .paso{font-size:14px; color:var(--suave); margin-right:6px}
.pill-vivo{display:inline-flex; align-items:center; gap:6px; background:var(--cielo); color:var(--azul); border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px; border:0}
.cliente .cuerpo{display:flex; flex-direction:column; gap:18px; padding:8px 40px 28px}
.livebar{border:1px solid var(--borde); border-radius:12px; padding:10px 16px; font-size:15px; color:var(--suave)}
.livebar b{color:var(--tinta)}
.livebar button{border:0; background:none; color:var(--azul); font-weight:700; padding:0 4px}
.central{flex:1; display:flex; flex-direction:column; justify-content:center}
.central .explica{min-height:0}
.nav-flotante-dock{position:fixed; left:50%; bottom:max(20px, env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:58; display:flex; align-items:center; justify-content:center; gap:6px; padding:4px 6px; border-radius:999px; pointer-events:none; background:rgba(15,47,72,.18); backdrop-filter:blur(4px); box-shadow:0 4px 20px rgba(15,47,72,.12)}
.nav-flotante-dock--elevated{bottom:calc(max(20px, env(safe-area-inset-bottom,0px)) + 40px)}
.nav-flotante-btn{pointer-events:auto; width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.38); background:rgba(15,47,72,.52); color:#fff; font-size:22px; line-height:1; display:grid; place-items:center; cursor:pointer; backdrop-filter:blur(6px); box-shadow:0 4px 14px rgba(15,47,72,.28); transition:background .2s,border-color .2s,transform .15s,opacity .2s}
.nav-flotante-btn:hover:not(:disabled){background:rgba(39,120,177,.82); border-color:rgba(255,255,255,.55)}
.nav-flotante-btn:active:not(:disabled){transform:scale(.96)}
.nav-flotante-btn:disabled{opacity:.35; cursor:not-allowed}
.copia .kicker{color:var(--azul); font-size:15px; font-weight:700; margin:0 0 8px}
.titular{font-family:var(--display); font-size:clamp(30px,2.8vw,44px); line-height:1.15; color:var(--tinta); margin:0 0 16px; font-weight:700; letter-spacing:-.01em}
.seg-graf{display:grid; grid-template-columns:1fr 1fr; background:var(--cielo); border-radius:12px; padding:4px; margin-bottom:14px}
.seg-graf button{border:0; background:transparent; border-radius:9px; padding:9px; font-weight:700; color:var(--suave)}
.seg-graf button[aria-pressed="true"]{background:var(--azul); color:#fff}
.tabla-graf{max-height:400px; overflow:auto; border-top:1px solid var(--borde)}
.tabla-graf table{width:100%; border-collapse:collapse; font-size:14px}
.tabla-graf th{text-align:left; color:var(--suave); font-weight:700; padding:8px 6px; border-bottom:1px solid var(--borde); position:sticky; top:0; background:var(--superficie)}
.tabla-graf td{padding:7px 6px; border-bottom:1px solid var(--borde)}
.tabla-graf td.num,.tabla-graf th.num{text-align:right}
.tabla-graf tr.tuya td{font-weight:800; color:var(--azul)}
.tabla-graf .ref{font-size:13px; color:var(--suave); padding:8px 6px}
.section-context-ticker{background:#f2f8fc; color:var(--tinta); border:1px solid rgba(39,120,177,.14); border-radius:16px; padding:12px 16px 10px; margin-bottom:12px; box-shadow:0 1px 0 rgba(39,120,177,.04)}
.section-context-ticker__head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:6px}
.section-context-ticker__label{font-size:12.5px; font-weight:700; color:var(--azul)}
.section-context-ticker__actions{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
.section-context-ticker__actions .btn{font-size:12px; padding:6px 12px}
.section-context-ticker__track{overflow:hidden; min-height:1.5em}
.section-context-ticker__track--scroll{mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.section-context-ticker__marquee{display:flex; width:max-content; gap:3rem; animation:sectionContextScroll 32s linear infinite}
.section-context-ticker__marquee span{font-size:17px; line-height:1.45; white-space:nowrap}
.section-context-ticker__static{margin:0; font-size:17px; line-height:1.45}
@keyframes sectionContextScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.section-context-ticker__marquee{animation:none; flex-wrap:wrap; width:auto; white-space:normal} .section-context-ticker__marquee span[aria-hidden=true]{display:none}}
.narracion-bar{display:none}
.narracion-bar small{display:block; font-size:12.5px; font-weight:700; opacity:.85}
.narracion-bar p{margin:2px 0 0; font-size:18px; line-height:1.4}
.presentation-handoff-banner{margin:0 0 16px;padding:14px 18px;border-radius:14px;border:1px solid rgba(37,99,235,.35);background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(14,165,233,.06))}
.presentation-handoff-banner__labels{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:6px}
.presentation-handoff-banner__labels strong{font-size:15px;color:var(--tinta)}
.presentation-handoff-banner__labels span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--azul)}
.presentation-handoff-banner p{margin:0;font-size:15px;line-height:1.45;color:var(--sub)}
.visitor-join-shell{min-height:calc(100vh - 46px);display:grid;place-items:center;padding:24px;background:linear-gradient(165deg,#f0f6fc 0%,#e8f0fa 45%,#f7fafc 100%)}

.plantilla-guion-etq{display:block; font-style:normal; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--azul); margin-bottom:4px}
.mod-col:last-child .tabs--solo{padding:12px 16px; border-bottom:1px solid var(--borde)}
.mod-col:last-child .tabs--solo .tabs-titulo{font-size:12.5px; font-weight:700; letter-spacing:.02em; color:var(--tinta)}
.mod-col:first-child .prep-vacio{color:rgba(191,227,240,.78)}
.prep-faq-lead{margin:0 0 10px; font-size:13px; line-height:1.45; color:var(--suave)}

.prep-faq-tips li{margin-bottom:4px}
.prep-faq-vacio{padding:14px 12px; margin-bottom:12px; border-radius:12px; border:1px dashed var(--borde); background:var(--cielo); font-size:13px; line-height:1.45}
.prep-faq-vacio p{margin:0 0 6px}
.prep-faq-lista{list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:10px; max-height:min(42vh,360px); overflow-y:auto}
.prep-faq-item{border:1px solid var(--borde); border-radius:12px; padding:12px; background:var(--superficie)}
.prep-faq-item-cabeza{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.prep-faq-item-cabeza strong{font-size:12px; color:var(--azul); text-transform:uppercase; letter-spacing:.04em}
.prep-faq-campo{display:flex; flex-direction:column; gap:4px; margin-bottom:8px; font-size:12px; font-weight:600}

.prep-faq-add{width:100%}
.banner-iniciar-reunion{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; padding:12px 16px; border-radius:12px; border:1px solid var(--borde); background:var(--cielo)}
.banner-iniciar-reunion p{margin:0; font-size:14px; color:var(--tinta)}
.revision-previa-mod{display:flex; flex-direction:column; gap:16px; width:100%}
.revision-toolbar-mod{display:flex; justify-content:flex-start}
.revision-encabezado{margin:0; font-size:clamp(18px,2.2vw,22px); color:var(--profundo)}
.revision-preview-wrap .dentro{max-height:min(52vh,520px); overflow:auto; padding:0}
.revision-preview-wrap .cliente--revision{pointer-events:none; transform:scale(.98); transform-origin:top center}
.guion-interno-mod{display:flex; flex-direction:column; gap:12px; border:1px solid var(--borde); border-radius:14px; padding:14px 16px; background:var(--cielo); max-height:min(48vh,480px); overflow:auto}
.guion-bloque-mod{padding-bottom:10px; border-bottom:1px solid var(--borde); font-size:14px}
.guion-bloque-mod:last-child{border-bottom:0; padding-bottom:0}
.guion-bloque-mod ul{margin:8px 0 0; padding:0; list-style:none; display:grid; gap:6px}
.guion-bloque-mod li span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--suave); font-weight:700}
.guion-aviso{margin:0; font-size:13px; color:var(--suave)}

const vals = a => a.filter(v => v != null && !Number.isNaN(v));
const prom = a => { a = vals(a); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const cuantil = (a, q) => { a = vals(a).sort((x, y) => x - y); if (!a.length) return null; const p = (a.length - 1) * q, i = Math.floor(p); return a[i] + (a[Math.min(i + 1, a.length - 1)] - a[i]) * (p - i); };
const mediana = a => cuantil(a, 0.5);
const promSinCeros = a => prom(vals(a).filter(v => v > 0));

const leer = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
function meetingIdPrepFaqs() { return String(window.__CATCH_MONITOR_SYNC__?.meetingId || 'local'); }
function clavePrepFaqs() { return 'catch:' + meetingIdPrepFaqs() + ':prepFaqs'; }
function normalizarPrepFaqsArray(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(r => {
    if (!r || typeof r !== 'object') return null;
    const id = typeof r.id === 'string' ? r.id.trim() : '';
    if (!id) return null;
    const pregunta = typeof r.question === 'string' ? r.question : (typeof r.pregunta === 'string' ? r.pregunta : '');
    const respuesta = typeof r.answer === 'string' ? r.answer : (typeof r.respuesta === 'string' ? r.respuesta : '');
    return { id, pregunta, respuesta };
  }).filter(Boolean);
}
function leerPrepFaqsReunion() { return normalizarPrepFaqsArray(leer(clavePrepFaqs())); }
function cachePrepFaqsLocal(items) {
  const serial = (items || []).map(r => ({ id: r.id, question: r.pregunta || r.question || '', answer: r.respuesta || r.answer || '' }));
  guardar(clavePrepFaqs(), serial);
}
function guardarPrepFaqsReunion(items) {
  cachePrepFaqsLocal(items);
  programarPersistirPrepFaqsServidor();
}
function recargarPrepFaqsDesdeStorage() { S.prepFaqs = leerPrepFaqsReunion(); }
function urlPrepFaqsReunion() {
  return '/api/meeting/' + encodeURIComponent(meetingIdPrepFaqs()) + '/prep-faqs';
}
let prepFaqSaveTimer = null;
let prepFaqsPollTimer = null;
function aplicarPrepFaqsServidor(items) {
  S.prepFaqs = normalizarPrepFaqsArray(items);
  cachePrepFaqsLocal(S.prepFaqs);
}
async function cargarPrepFaqsDesdeServidor() {
  const id = meetingIdPrepFaqs();
  if (!id || id === 'local') return false;
  try {
    const res = await fetch(urlPrepFaqsReunion());
    if (!res.ok) return false;
    const data = await res.json();
    const items = normalizarPrepFaqsArray(data.items || []);
    const cfg = window.__CATCH_MONITOR_SYNC__;
    const esMod = cfg?.role === 'moderador' || S.rol === 'moderador';
    if (esMod && items.length === 0 && prepFaqsVisibles(S.prepFaqs).length) {
      void persistirPrepFaqsServidor();
      return true;
    }
    aplicarPrepFaqsServidor(items);
    return true;
  } catch {
    return false;
  }
}
function programarPersistirPrepFaqsServidor() {
  if (prepFaqSaveTimer) clearTimeout(prepFaqSaveTimer);
  prepFaqSaveTimer = setTimeout(() => { void persistirPrepFaqsServidor(); }, 500);
}
async function persistirPrepFaqsServidor() {
  const cfg = window.__CATCH_MONITOR_SYNC__;
  if (!cfg?.meetingId || !cfg.presenterToken || cfg.role !== 'moderador') return;
  const items = (S.prepFaqs || []).map(r => ({
    id: r.id,
    question: r.pregunta || r.question || '',
    answer: r.respuesta || r.answer || '',
  }));
  try {
    await fetch(urlPrepFaqsReunion(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-presenter-token': cfg.presenterToken },
      body: JSON.stringify({ items }),
    });
  } catch { /* ignore */ }
}
function iniciarPollPrepFaqs() {
  if (prepFaqsPollTimer) return;
  void cargarPrepFaqsDesdeServidor().then(ok => {
    if (!ok) recargarPrepFaqsDesdeStorage();
    if (S.rol === 'moderador' && (S.tabMod === 'preguntas' || typeof vistaPrepPresentador === 'function' && vistaPrepPresentador())) {
      if (typeof refrescarPanelPrepFaqs === 'function') refrescarPanelPrepFaqs();
      else if (typeof actualizarPanelModeradorParcial === 'function') actualizarPanelModeradorParcial();
    }
  });
  prepFaqsPollTimer = setInterval(() => {
    const cfg = window.__CATCH_MONITOR_SYNC__;
    if (cfg?.role === 'moderador' || S.rol === 'moderador') return;
    void cargarPrepFaqsDesdeServidor();
  }, 3000);
}
function prepFaqsVisibles(items) {
  return (items || []).filter(r => (r.pregunta || '').trim() || (r.respuesta || '').trim());
}

function baseOpc(compacto, extra = {}) {   // estilo minimalista: sin bordes de ejes, rejilla tenue
  const f = {family: 'Nunito Sans', size: compacto ? 10 : 12};
  return Object.assign({responsive: true, maintainAspectRatio: false, animation: modoPDF ? false : {duration: 650, easing: 'easeOutCubic'}, transitions: {resize: {animation: {duration: 0}}},
    plugins: {legend: {display: false, labels: {color: col('--suave'), usePointStyle: true, pointStyle: 'circle', boxWidth: 8, font: f}},
      tooltip: {backgroundColor: '#FFFFFF', titleColor: '#232222', bodyColor: '#5B6168', borderColor: '#E6E7E8', borderWidth: 1, padding: 10, cornerRadius: 10, titleFont: {family: 'Nunito Sans', weight: '700'}, bodyFont: {family: 'Nunito Sans'}, displayColors: false}},

             y: {border: {display: false}, ticks: {color: col('--suave'), font: f, maxTicksLimit: 5}, grid: {color: col('--borde'), drawTicks: false}}}}, extra);
}

}

function conteo(lista) { const n = vals(lista).length, c = {}; vals(lista).forEach(v => c[v] = (c[v] || 0) + 1); return Object.entries(c).map(([label, k]) => ({label, v: k / n})).sort((a, b) => b.v - a.v); }
function conteoProcesos(M) { const r = M.filter(e => (e.procesos || []).length); const c = {}; r.forEach(e => e.procesos.forEach(p => c[p] = (c[p] || 0) + 1)); return Object.entries(c).map(([k, n]) => ({k, label: PROCESO[k] || k, v: n / r.length})).sort((a, b) => b.v - a.v); }
function edadMercado(M) { const r = M.filter(e => e.edad.some(v => v != null)); const w = r.map(e => (e.op || 0) + (e.adm || 0) + (e.otro || 0)); const W = w.reduce((a, b) => a + b, 0); return [0, 1, 2, 3, 4].map(i => r.reduce((s, e, j) => s + (e.edad[i] || 0) * w[j], 0) / W); }
function rango(lista, v) { const a = vals(lista); return a.filter(x => x < v).length / a.length; }
function mesesMercado(M) { const r = M.filter(e => e.mes.some(x => x)); return MESES.map((_, i) => r.filter(e => e.mes[i]).length / r.length); }
function beneficiosMercado(M) { const r = M.filter(e => e.ben.some(x => x)); return DATOS.beneficios.map((label, i) => ({i, label: label.replace('Incremento en ', 'Incremento en '), v: r.filter(e => e.ben[i]).length / r.length})).filter(x => x.v > 0).sort((a, b) => b.v - a.v); }
function causasMercado(M) { const r = M.filter(e => e.mot.some(v => v != null)); return DATOS.motivos.map((label, i) => ({i, label, v: r.filter(e => (e.mot[i] ?? -1) >= 3).length / r.length})).sort((a, b) => b.v - a.v); }
function etapa(t) { if (!t) return null; if (/pendiente/i.test(t)) return 'Pendiente'; const m = t.match(/(20\d\d)/); if (m) return 'Revisado ' + m[1]; return 'No aplica'; }
function serieRot(M) { const total = [], nc = [], ct = []; DATOS.bimestres.forEach((_, i) => { const p = M.filter(e => (e.rot[i] ?? 0) > 0); total.push(prom(p.map(e => e.rot[i]))); nc.push(prom(p.map(e => e.rnc[i]))); ct.push(prom(p.map(e => e.rc[i]))); }); return {total, nc, ct}; }
function conteoTamano(M) { const n = M.length, c = {}; M.forEach(e => { const t = e.tamano || 'Sin dato'; c[t] = (c[t] || 0) + 1; }); return TAMANOS.filter(t => c[t]).map(t => ({label: t, v: c[t] / n})).concat(c['Sin dato'] ? [{label: 'Sin dato', v: c['Sin dato'] / n}] : []).sort((a, b) => b.v - a.v); }
function mixContratacion(lista) { const i = ULT; let cn = 0, cr = 0; lista.forEach(e => { cn += num(e.cn?.[i]) || 0; cr += num(e.cr?.[i]) || 0; }); const t = cn + cr || 1; return {cn, cr, total: t, pCn: cn / t, pCr: cr / t}; }
function mixContratacionBimestre(lista, i) { let cn = 0, cr = 0; lista.forEach(e => { cn += num(e.cn?.[i]) || 0; cr += num(e.cr?.[i]) || 0; }); const t = cn + cr || 1; return {cn, cr, total: t, pCn: cn / t, pCr: cr / t}; }
function mercadoMeta() { return DATOS.mercado || {}; }

function etiquetasNegras(textoEn) {
  return {id: 'etiqNegras', afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const horizontal = chart.options.indexAxis === 'y';
    ctx.save();
    ctx.fillStyle = '#232222';
    ctx.font = '700 13px "Nunito Sans", sans-serif';
    chart.data.datasets.forEach((ds, di) => {
      if (ds.type === 'line') return;
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((bar, i) => {
        const raw = ds.data[i];
        if (raw == null) return;
        const txt = textoEn(raw, i, ds);
        if (!txt) return;
        if (horizontal) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bar.x + 8, bar.y); }
        else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(txt, bar.x, bar.y - 6); }
      });
    });
    ctx.restore();
  }};
}

function etiquetaBimestreCorta(b) { return String(b).replace(' 20', ' '); }
function configPrediccion(M, compacto) {
  const hist = serieRot(M).total.slice();

  if (oficial.haceUnAno != null) hist[0] = oficial.haceUnAno;
  if (oficial.ultimo != null) hist[hist.length - 1] = oficial.ultimo;
  const futuro = ['Sep-Oct 2025', 'Nov-Dic 2025', 'Ene-Feb 2026', 'Mar-Abr 2026', 'May-Jun 2026', 'Jul-Ago 2026', 'Sep-Oct 2026', 'Nov-Dic 2026'];

  const labels = DATOS.bimestres.concat(futuro);
  const nH = hist.length;
  const huecos = n => Array(n).fill(null);
  const ultimo = hist[nH - 1];
  const historia = hist.concat(huecos(pron.length));
  const techo = huecos(nH - 1).concat([ultimo], banda.map(b => b[1]));
  const piso = huecos(nH - 1).concat([ultimo], banda.map(b => b[0]));
  const mediana = huecos(nH - 1).concat([ultimo], pron);

  o.layout = {padding: {top: 8, right: 8}};

    {label: 'Pronóstico (mediana)', data: mediana, borderColor: '#2778B1', backgroundColor: '#2778B1', borderDash: [6, 4], borderWidth: 2.4, ...punto},
  ]}, options: o};

  else if (!sinEje.includes(cfg.type)) cfg.options.interaction = {mode: 'nearest', intersect: false, axis: cfg.options.indexAxis === 'y' ? 'y' : 'x'};
  else if (cfg.type === 'scatter' || cfg.type === 'bubble') cfg.options.interaction = {mode: 'nearest', intersect: true};
  (cfg.data.datasets || []).forEach(ds => {
    const tipo = ds.type || cfg.type;
    if ((tipo === 'line' || tipo === 'scatter') && ds.pointHitRadius == null) ds.pointHitRadius = 14;
  });
  const M = canvas.dataset.todo ? EMP : mercado().M;
  let clickTimer = null;
  cfg.options.onClick = (ev, els, chart) => {
    if (canvas.$catchDblLock) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      const el = els.length ? els[0] : elementoPrecisoEnEvento(chart, ev.native);
      if (!el) { cerrarFuente(); return; }
      const k = claveFuenteElemento(g, el);
      if (S.fuenteClave === k && $('#fuente')?.classList.contains('abierta')) { cerrarFuente(); return; }
      if (iaSeleccionContextualHabilitada()) {
        try {
          mostrarPopoverSeleccionIA(
            { x: ev.native.clientX, y: ev.native.clientY },
            construirSeleccionGrafica(g, chart, el, ev.native),
          );
        } catch { /* el dato sigue abriéndose abajo */ }
      }
      mostrarFuente(g, chart, el, M);
      marcarAperturaFuente();
    }, 240);
  };
  cfg.options.onHover = (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; };
  if (!cfg.options.animation) cfg.options.animation = modoPDF ? false : {duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 480, easing: 'easeOutCubic'};
  const chart = new Chart(canvas, cfg);
  canvas.ondblclick = (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    clearTimeout(clickTimer);
    canvas.$catchDblLock = true;
    cerrarFuente();
    const el = elementoPrecisoEnEvento(chart, ev);
    if (!puedePublicarResaltado()) {
      setTimeout(() => { canvas.$catchDblLock = false; }, 300);
      return;
    }
    if (!el) publicarResaltado(null);
    else {
      const ref = metaResaltadoDesdeElemento(g, chart, el);
      if (mismoResaltado(S.monitorHighlight, ref)) publicarResaltado(null);
      else publicarResaltado(ref);
    }
    setTimeout(() => { canvas.$catchDblLock = false; }, 300);
  };
  aplicarCapaResaltado(chart, g, false);
  graficos.set(canvas.id, chart);
}
function mostrarFuente(g, chart, el, M) {
  const ds = chart.data.datasets[el.datasetIndex]; const raw = ds.data[el.index];
  const etiqueta = raw?.id || chart.data.labels?.[el.index] || ds.label || 'Dato';
  const cb = chart.options.plugins.tooltip.callbacks?.label;
  let valor = cb ? cb({raw, dataset: ds, label: etiqueta, parsed: {y: raw, x: raw}}).trim() : String(raw);
  const esEmpresa = /^EMP_/.test(etiqueta);
  const quien = esEmpresa ? (etiqueta === CLIENTE ? 'Su empresa' : 'Otra empresa (anónima)') : (ds.label ? ds.label + ' · ' + etiqueta : etiqueta);
  const d = DETALLE[g.id];
  const caja = $('#fuente');
  caja.innerHTML = `<div class="cab"><h3>De dónde sale este dato</h3><button class="btn texto" data-cerrar-fuente aria-label="Cerrar">Cerrar</button></div>
    <div class="valor">${esc(valor.replace(/^.*?:\s*/, ''))}</div>

  S.fuenteClave = claveFuenteElemento(g, el);
  caja.classList.add('abierta');
  try {
    const sec = seccionActual();
    const sectionName = sec >= 0 && SECCIONES[sec] ? SECCIONES[sec].nombre : null;
    window.__CATCH_MONITOR_API__?.trackFromTouch?.('grafico', g.id, sec, sectionName, {

      element_id: String(etiqueta),
      element_label: String(etiqueta),
      metadata: { category: String(etiqueta), chart_title: g.titulo },
    });
  } catch { /* ignore */ }
  registrar('justificacion', g.titulo);
}

function valorVisibleGrafica(g, chart, el) {

function preguntaDesdeSeleccionContextual(sel) {

  const val = sel.value ? ` Valor visible: ${sel.value}.` : '';

  return `En la diapositiva actual (paso ${paso}${sec})${diapo}, en ${graf}, seleccioné ${tipo} «${elem}»${serie}.${val} ¿Qué representa y cómo debe interpretarse según los datos de esta visualización?`;

async function enviarSeleccionContextualIA() {

let reconocimientoIA = null;
let escuchandoIA = false;
let baseTranscripcionIA = '';
let micConversacionDeseada = false;
let vozEnvioTimer = null;
let vozEnvioEnCurso = false;
let ultimaPreguntaEnviadaIA = '';
let vozRaizActiva = null;
const IA_VOZ_AUTO_ENVIO_KEY = 'catch-ia-voz-auto-envio';
function leerAutoEnvioVozIA() {
  try {
    const v = sessionStorage.getItem(IA_VOZ_AUTO_ENVIO_KEY);
    if (v === null) return S.rol === 'moderador';
    return v === '1';
  } catch { return S.rol === 'moderador'; }
}
function guardarAutoEnvioVozIA(on) {
  try { sessionStorage.setItem(IA_VOZ_AUTO_ENVIO_KEY, on ? '1' : '0'); } catch { /* ignore */ }
  sincronizarUiAutoEnvioVozIA();
}
function sincronizarUiAutoEnvioVozIA() {
  const on = leerAutoEnvioVozIA();
  document.querySelectorAll('[data-ia-voz-auto-envio]').forEach(el => { el.checked = on; });
}
function programarEnvioVozDesdeMic() {
  if (!leerAutoEnvioVozIA()) return;
  clearTimeout(vozEnvioTimer);
  vozEnvioTimer = setTimeout(() => {
    if (iaRespuestaActiva > 0 || vozEnvioEnCurso) return;
    const inp = $('#inIA');
    const t = inp?.value?.trim();
    const navRepetible = S.rol === 'moderador' && !!instruccionNavegacionModerador(t);
    if (!t || (t === ultimaPreguntaEnviadaIA && !navRepetible)) return;
    void enviarIA({ keepMic: true, reanudarMicTrasRespuesta: true });
  }, 1200);
}
function pausarReconocimientoVozIA() {
  if (!reconocimientoIA) return;
  try { reconocimientoIA.stop(); } catch (_) {}
  reconocimientoIA = null;
  escuchandoIA = false;
  uiEscuchandoVozIA(document, false);
}
function programarReanudarVozIA() {
  if (!micConversacionDeseada || !leerAutoEnvioVozIA() || !vozRaizActiva) return;
  setTimeout(() => {
    if (iaRespuestaActiva > 0 || escuchandoIA) return;
    iniciarEscuchaVozIA(vozRaizActiva);
  }, 400);
}

function soporteReconocimientoVozIA() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function uiEscuchandoVozIA(raiz, activo) {
  const root = raiz || document;
  root.querySelectorAll('[data-ia-mic]').forEach(btn => {
    btn.classList.toggle('escuchando', !!activo);
    btn.setAttribute('aria-pressed', String(!!activo));
    btn.setAttribute('aria-label', activo ? 'Detener dictado por voz' : 'Dictar pregunta por voz');
    btn.title = activo ? 'Detener dictado' : 'Dictar pregunta';
  });
  root.querySelectorAll('#iaVozLive').forEach(el => { el.hidden = !activo; });
}
function detenerVozIA() {
  micConversacionDeseada = false;
  clearTimeout(vozEnvioTimer);
  if (!reconocimientoIA && !escuchandoIA) return;
  try { reconocimientoIA?.stop(); } catch (_) {}
  reconocimientoIA = null;
  escuchandoIA = false;
  uiEscuchandoVozIA(document, false);
}
function raizVozIA() {
  return vozRaizActiva || document.getElementById('app') || document;
}
function alternarMicVozIA() {
  const raiz = raizVozIA();
  if (escuchandoIA) {
    detenerVozIA();
    return;
  }
  if (S.rol === 'moderador') {
    micConversacionDeseada = true;
    if (!leerAutoEnvioVozIA()) guardarAutoEnvioVozIA(true);
  } else {
    micConversacionDeseada = leerAutoEnvioVozIA();
  }
  vozRaizActiva = raiz;
  iniciarEscuchaVozIA(raiz);
}
function iniciarEscuchaVozIA(raiz) {
  const inp = raiz.querySelector('#inIA');
  const aviso = raiz.querySelector('#iaVozAviso');
  const live = raiz.querySelector('#iaVozLive');
  if (!inp || escuchandoIA) return;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognitionCtor) return;
  const rec = new SpeechRecognitionCtor();
  reconocimientoIA = rec;
  rec.lang = 'es-MX';
  rec.continuous = true;
  rec.interimResults = true;
  baseTranscripcionIA = (inp.value || '').trim();
  rec.onstart = () => {
    escuchandoIA = true;
    uiEscuchandoVozIA(raiz, true);
    mostrarAvisoVozIA(aviso, '');
    if (live) live.hidden = false;
  };
  rec.onend = () => {
    escuchandoIA = false;
    uiEscuchandoVozIA(raiz, false);
    if (reconocimientoIA === rec) reconocimientoIA = null;
    if (micConversacionDeseada && leerAutoEnvioVozIA() && iaRespuestaActiva === 0) {
      setTimeout(() => {
        if (micConversacionDeseada && !escuchandoIA) iniciarEscuchaVozIA(raiz);
      }, 300);
    }
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      mostrarAvisoVozIA(aviso, 'Permiso de micrófono denegado. Puede escribir la pregunta.');
      micConversacionDeseada = false;
    } else if (ev.error !== 'aborted' && ev.error !== 'no-speech') {
      mostrarAvisoVozIA(aviso, 'No se pudo escuchar. Escriba la pregunta o intente de nuevo.');
    }
  };
  rec.onresult = ev => {
    let finalTxt = '';
    let interimTxt = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const trozo = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalTxt += trozo;
      else interimTxt += trozo;
    }
    if (finalTxt) {
      const f = finalTxt.trim();
      if (!f) return;
      baseTranscripcionIA = baseTranscripcionIA ? `${baseTranscripcionIA.trim()} ${f}` : f;
      inp.value = baseTranscripcionIA;
      programarEnvioVozDesdeMic();
    } else if (interimTxt) {
      const base = baseTranscripcionIA.trim();
      inp.value = base ? `${base} ${interimTxt.trim()}` : interimTxt.trim();
    }
  };
  try {
    rec.start();
  } catch (_) {
    mostrarAvisoVozIA(aviso, 'No se pudo iniciar el micrófono. Puede escribir la pregunta.');
    detenerVozIA();
  }
}
function mostrarAvisoVozIA(aviso, msg) {
  if (!aviso) return;
  aviso.textContent = msg || '';
}
function enlazarVozIA(raiz) {
  if (S.rol !== 'cliente' && S.rol !== 'moderador') {
    raiz.querySelectorAll('[data-ia-voz]').forEach(el => el.remove());
    return;
  }
  const bloque = raiz.querySelector('[data-ia-voz]');
  const inp = raiz.querySelector('#inIA');
  const aviso = raiz.querySelector('#iaVozAviso');
  if (!inp || !bloque) return;
  vozRaizActiva = raiz;
  raiz.querySelectorAll('[data-ia-hablar-auto]').forEach(el => {
    if (el.dataset.iaAutoBound) return;
    el.dataset.iaAutoBound = '1';
    el.addEventListener('change', () => guardarAutoTtsIA(el.checked));
  });
  raiz.querySelectorAll('[data-ia-voz-auto-envio]').forEach(el => {
    if (el.dataset.iaVozAutoBound) return;
    el.dataset.iaVozAutoBound = '1';
    el.addEventListener('change', () => guardarAutoEnvioVozIA(el.checked));
  });
  if (!soporteReconocimientoVozIA()) {
    raiz.querySelectorAll('[data-ia-mic]').forEach(btn => {
      btn.disabled = true;
      btn.title = 'Reconocimiento de voz no disponible en este navegador';
    });
    mostrarAvisoVozIA(aviso, 'El dictado por voz no está disponible aquí; puede escribir la pregunta.');
    return;
  }
  raiz.querySelectorAll('[data-ia-mic]').forEach(btn => {
    if (btn.dataset.iaMicBound) return;
    btn.dataset.iaMicBound = '1';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      vozRaizActiva = raiz;
      alternarMicVozIA();
    });
  });
  sincronizarUiAutoEnvioVozIA();
  uiEscuchandoVozIA(document, escuchandoIA);
}

function contarCifras(raiz) {   // la cifra grande cuenta desde 0: el único movimiento de la escena
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('[data-contar]').forEach(el => {
    const txt = el.dataset.contar; const m = txt.match(/[\d.,]+/); if (!m) return;
    const crudo = m[0], fin = parseFloat(crudo.replace(/,/g, '')); const dec = (crudo.split('.')[1] || '').length; const t0 = performance.now();
    const paso = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
      const n = (fin * e).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      el.textContent = txt.replace(crudo, crudo.includes(',') ? n : n.replace(/,/g, '')); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}
